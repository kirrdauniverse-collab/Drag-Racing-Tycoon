function drawSceneStatic(m){
  const cv=$('#track'); if(!cv) return;
  const ctx=cv.getContext('2d'); const W=cv.width, H=cv.height;
  const state={running:false,m,backfire:{a:0,b:0},autoCam:'side',phase:'stage',
    wheelAngle:0,burnout:false,scoreProgress:0,stopProgress:0};
  ctx.clearRect(0,0,W,H);
  drawScene(ctx,W,H,0.02,0.02,state);
}
function drawScene(ctx,W,H,pA,pB,state){
  let cam=G.camMode;
  if(cam==='auto') cam=state.autoCam||'side';
  if(cam==='side') drawSideView(ctx,W,H,pA,pB,state);
  else if(cam==='crew') drawCrewView(ctx,W,H,pA,pB,state);
  else if(cam==='drone') drawDroneIntroView(ctx,W,H,pA,pB,state);
  else if(cam==='top') drawTopView(ctx,W,H,pA,pB,state);
  else if(cam==='finish') drawFinishView(ctx,W,H,pA,pB,state);
}

/* ==================================================================
   AUTÓ RAJZOLÓ (oldalnézet)
   ================================================================== */
function drawComicCar(ctx, opts){
  const { state, side, p } = opts;
  const d = state.m[side].d;
  const cat = d.catRef || CATEGORIES[0];
  const livery = d.livery;
  const color = livery.color;
  const color2 = livery.color2;
  const bfActive = state.backfire && state.backfire[side]>0 && state.backfire[side]<0.35;
  const running = state.running;
  const burnout = state.burnout;
  const stuck = state.m[side].run && state.m[side].run.stuck;
  const slideOff = state.m[side].run && state.m[side].run.slideOff;

  // "STUCK!" felirat
  if(stuck && state.phase === 'run'){
    ctx.save();
    ctx.fillStyle = '#ff2d55';
    ctx.strokeStyle = '#0a0a0f';
    ctx.lineWidth = 3;
    ctx.font = 'bold 22px Impact, sans-serif';
    ctx.textAlign = 'center';
    const bob = Math.sin(Date.now()*0.008)*3;
    ctx.translate(0, -50 + bob);
    ctx.strokeText('BERAGADT!', 0, 0);
    ctx.fillText('BERAGADT!', 0, 0);
    ctx.textAlign = 'left';
    ctx.restore();
  }
  // "KICSÚSZOTT!" felirat
  if(slideOff && state.phase === 'run' && p > 0.5){
    ctx.save();
    ctx.fillStyle = '#ffd60a';
    ctx.strokeStyle = '#0a0a0f';
    ctx.lineWidth = 3;
    ctx.font = 'bold 18px Impact, sans-serif';
    ctx.textAlign = 'center';
    ctx.translate(-60, -60);
    ctx.rotate(-0.2);
    ctx.strokeText('KICSÚSZOTT!', 0, 0);
    ctx.fillText('KICSÚSZOTT!', 0, 0);
    ctx.textAlign = 'left';
    ctx.restore();
  }
  if(burnout && seededRand(Date.now()*0.01) < 0.15){
    ctx.save();
    ctx.fillStyle = '#ffd60a'; ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 3;
    ctx.font = 'bold 20px Impact, sans-serif';
    const txt = pick(['VROOM!','BURNOUT!','POW!','BANG!','V8!']);
    const rot = (seededRand(Date.now()*0.02)-0.5)*0.5;
    ctx.translate(-120, -40); ctx.rotate(rot);
    ctx.strokeText(txt, 0, 0); ctx.fillText(txt, 0, 0);
    ctx.restore();
  }
  if(running && p > 0.15){
    for(let i=0;i<8;i++){
      const yOff = -20 + i*5, len = 40 + seededRand(i)*60;
      ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-78, yOff); ctx.lineTo(-78-len, yOff); ctx.stroke();
    }
  }
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.ellipse(0,20,65,7,0,0,7); ctx.fill();
  const bodyType = cat.bodyType;
  const rearR = bodyType==='sedan'||bodyType==='tuned' ? 18 : bodyType==='funnycar' ? 26 : 22;
  const rearX = bodyType==='topfuel' ? -52 : -48;
  const frontX = bodyType==='topfuel' ? 88 : bodyType==='funnycar' ? 60 : 72;
  ctx.fillStyle = '#0a0a0f'; ctx.beginPath(); ctx.arc(rearX, 0, rearR, 0, 7); ctx.fill();
  ctx.fillStyle = '#1a1a1a'; ctx.beginPath(); ctx.arc(rearX, 0, rearR-3, 0, 7); ctx.fill();
  ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(rearX, 0, rearR, 0, 7); ctx.stroke();
  ctx.fillStyle = '#888'; ctx.beginPath(); ctx.arc(rearX, 0, 6, 0, 7); ctx.fill();
  ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2; ctx.stroke();
  if((running || burnout) && !stuck){
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    const wa = burnout ? (state.wheelAngle*2) : (state.wheelAngle||0);
    for(let i=0;i<4;i++){
      const a=wa+(i/4)*Math.PI*2;
      ctx.beginPath(); ctx.moveTo(rearX, 0);
      ctx.lineTo(rearX+Math.cos(a)*(rearR-10), Math.sin(a)*(rearR-10));
      ctx.stroke();
    }
  }
  const frontR = bodyType==='sedan'||bodyType==='tuned' ? 8 : 7;
  ctx.fillStyle = '#0a0a0f'; ctx.beginPath(); ctx.arc(frontX, 10, frontR, 0, 7); ctx.fill();
  ctx.fillStyle = '#333'; ctx.beginPath(); ctx.arc(frontX, 10, frontR-3, 0, 7); ctx.fill();
  ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(frontX, 10, frontR, 0, 7); ctx.stroke();
  drawComicBody(ctx, bodyType, color, color2, livery, d);
  if(bodyType!=='sedan' && bodyType!=='tuned'){
    [45,38,31,24].forEach(hx=>{
      ctx.strokeStyle='#0a0a0f'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(hx,-10); ctx.lineTo(hx-8,-3); ctx.stroke();
    });
  }
  if((running || bfActive) && !burnout && !stuck){
    const flameX = bodyType==='topfuel' ? -80 : bodyType==='funnycar' ? -72 : -72;
    const big=bfActive;
    const flameLen=big?55:25+seededRand(Date.now()*0.03)*12;
    const flameGrad=ctx.createRadialGradient(flameX, 2, 0, flameX, 2, flameLen);
    flameGrad.addColorStop(0, '#fff'); flameGrad.addColorStop(0.3, '#ffd60a');
    flameGrad.addColorStop(0.7, '#ff6b1a'); flameGrad.addColorStop(1, 'rgba(255,45,85,0)');
    ctx.fillStyle=flameGrad;
    ctx.beginPath();
    ctx.moveTo(flameX+10, -3);
    ctx.lineTo(flameX+10-flameLen-seededRand(Date.now()*0.04)*8, 2);
    ctx.lineTo(flameX+10, 7);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#0a0a0f'; ctx.lineWidth=2; ctx.stroke();
    if(big && seededRand(Date.now()*0.05) < 0.3){
      ctx.save();
      ctx.fillStyle = '#ff2d55'; ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 3;
      ctx.font = 'bold 22px Impact, sans-serif';
      ctx.translate(flameX-30, -30); ctx.rotate(-0.2);
      ctx.strokeText('BANG!', 0, 0); ctx.fillText('BANG!', 0, 0);
      ctx.restore();
    }
  }
}
function drawComicBody(ctx, bodyType, color, color2, livery, d){
  ctx.fillStyle = color;
  if(bodyType==='sedan' || bodyType==='tuned'){
    ctx.beginPath();
    ctx.moveTo(70, 6); ctx.lineTo(73, -4); ctx.lineTo(68, -12);
    ctx.lineTo(46, -15); ctx.lineTo(28, -18); ctx.lineTo(20, -38);
    ctx.lineTo(-16, -40); ctx.lineTo(-30, -24); ctx.lineTo(-50, -22);
    ctx.lineTo(-64, -14); ctx.lineTo(-67, -4); ctx.lineTo(-64, 8);
    ctx.lineTo(-38, 10); ctx.lineTo(40, 10);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 4; ctx.stroke();
    ctx.fillStyle = shade(color, 60);
    ctx.beginPath();
    ctx.moveTo(65, -10); ctx.lineTo(30, -16); ctx.lineTo(22, -34);
    ctx.lineTo(-14, -36); ctx.lineTo(-14, -32); ctx.lineTo(20, -30);
    ctx.lineTo(28, -14); ctx.lineTo(63, -8);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = shade(color, -60);
    ctx.beginPath();
    ctx.moveTo(-64, 4); ctx.lineTo(40, 6); ctx.lineTo(40, 10); ctx.lineTo(-64, 8);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(15, -20); ctx.lineTo(15, 8); ctx.stroke();
    ctx.fillStyle = '#666'; ctx.fillRect(17, -6, 6, 3);
    ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 1.5;
    ctx.strokeRect(17, -6, 6, 3);
    ctx.fillStyle = '#4aa8ff';
    ctx.beginPath();
    ctx.moveTo(28, -18); ctx.lineTo(20, -36); ctx.lineTo(2, -36); ctx.lineTo(2, -18);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath();
    ctx.moveTo(24, -34); ctx.lineTo(20, -22); ctx.lineTo(8, -22); ctx.lineTo(8, -34);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#4aa8ff';
    ctx.beginPath();
    ctx.moveTo(-16, -38); ctx.lineTo(-28, -24); ctx.lineTo(-6, -24); ctx.lineTo(-6, -38);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 3; ctx.stroke();
    if(livery.hasStripes){
      ctx.fillStyle = color2; ctx.fillRect(-62, -4, 130, 5);
      ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2;
      ctx.strokeRect(-62, -4, 130, 5);
    } else if(livery.hasTwoTone){
      ctx.fillStyle = color2; ctx.fillRect(-64, 2, 135, 6);
      ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2;
      ctx.strokeRect(-64, 2, 135, 6);
    } else {
      ctx.fillStyle = color2;
      for(let i=0;i<6;i++){
        const fx=-50+i*18;
        ctx.beginPath();
        ctx.moveTo(fx, 0);
        ctx.quadraticCurveTo(fx+5, -8, fx+10, 0);
        ctx.quadraticCurveTo(fx+13, 6, fx+18, 0);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 1.5; ctx.stroke();
      }
    }
    ctx.fillStyle = '#ffd60a';
    ctx.beginPath(); ctx.ellipse(70, -8, 5, 3.5, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = '#0a0a0f'; ctx.fillRect(62, -2, 8, 6);
    ctx.strokeStyle = '#666'; ctx.lineWidth = 1;
    for(let i=0;i<3;i++){ ctx.beginPath(); ctx.moveTo(63, -1+i*2); ctx.lineTo(69, -1+i*2); ctx.stroke(); }
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(-25, -8, 12, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#0a0a0f';
    ctx.font = 'bold 12px Impact, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(d.car, -25, -3); ctx.textAlign = 'left';
  } else {
    let noseY = -30, tailY = -22;
    if(bodyType==='topfuel'){ noseY = -26; tailY = -16; }
    else if(bodyType==='funnycar'){ noseY = -32; tailY = -18; }
    else if(bodyType==='promod'){ noseY = -32; tailY = -22; }
    else if(bodyType==='prostock'){ noseY = -30; tailY = -20; }
    ctx.beginPath();
    ctx.moveTo(88, 6); ctx.lineTo(86, -2);
    ctx.bezierCurveTo(82, -8, 72, -12, 60, -14);
    ctx.lineTo(28, noseY);
    ctx.bezierCurveTo(20, noseY-2, 16, -22, 12, -26);
    ctx.lineTo(0, noseY-4); ctx.lineTo(-14, noseY-2);
    ctx.lineTo(-40, tailY); ctx.lineTo(-58, tailY);
    ctx.lineTo(-66, -14); ctx.lineTo(-66, 8); ctx.lineTo(-40, 10); ctx.lineTo(40, 10);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 4; ctx.stroke();
    ctx.fillStyle = shade(color, 60);
    ctx.beginPath();
    ctx.moveTo(84, -4);
    ctx.bezierCurveTo(80, -10, 70, -14, 55, -16);
    ctx.lineTo(28, noseY+3); ctx.lineTo(28, noseY+1);
    ctx.lineTo(55, -13);
    ctx.bezierCurveTo(70, -11, 78, -6, 82, -1);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = shade(color, -60);
    ctx.beginPath();
    ctx.moveTo(-66, 4); ctx.lineTo(88, 4); ctx.lineTo(88, 8); ctx.lineTo(-66, 8);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#4aa8ff';
    ctx.beginPath();
    ctx.moveTo(14, -22); ctx.lineTo(2, -26); ctx.lineTo(-10, -24); ctx.lineTo(8, -16);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0,-20,5,0,7); ctx.fill();
    ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = '#0a0a0f';
    ctx.beginPath(); ctx.arc(0,-20,3.5,-0.3,0.3+Math.PI,true); ctx.fill();
    if(livery.hasStripes){
      ctx.fillStyle = color2; ctx.fillRect(-56, -3, 130, 4);
      ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2;
      ctx.strokeRect(-56, -3, 130, 4);
    } else if(livery.hasTwoTone){
      ctx.fillStyle = color2; ctx.fillRect(-64, 2, 150, 6);
      ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2;
      ctx.strokeRect(-64, 2, 150, 6);
    } else {
      ctx.fillStyle = color2;
      for(let i=0;i<5;i++){
        const fx=-40+i*22;
        ctx.beginPath();
        ctx.moveTo(fx, 0);
        ctx.quadraticCurveTo(fx+4, -6, fx+10, 0);
        ctx.quadraticCurveTo(fx+12, 4, fx+18, 0);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 1.5; ctx.stroke();
      }
    }
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(50, -6, 10, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#0a0a0f';
    ctx.font = 'bold 11px Impact, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(d.car, 50, -2); ctx.textAlign = 'left';
  }
  if(bodyType!=='sedan' && bodyType!=='tuned'){
    let wingH = 30;
    if(bodyType==='funnycar') wingH = 55;
    else if(bodyType==='promod') wingH = 34;
    else if(bodyType==='topfuel') wingH = 48;
    ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-62, -22); ctx.lineTo(-62, -wingH-10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-32, -22); ctx.lineTo(-32, -wingH-10); ctx.stroke();
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.moveTo(-70, -wingH-10); ctx.lineTo(-26, -wingH-10);
    ctx.lineTo(-26, -wingH); ctx.lineTo(-70, -wingH);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillRect(-70, -wingH-10, 44, 3);
  }
}

/* ==================================================================
   OLDALNÉZET
   ================================================================== */
function drawSideView(ctx,W,H,pA,pB,state){
  const locId=G.event?G.event.loc.id:'county';
  const tod = G.event?.timeOfDay || 'night';
  const groundY=H*0.55;
  drawComicSky(ctx, W, H, groundY, tod);
  drawComicBackground(ctx, W, H, groundY, locId, tod);

  if(locId==='county'){ drawComicStand(ctx, W*0.05, groundY-5, 280, 60, 5, 32, 0.8); }
  else if(locId==='national'){
    drawComicStand(ctx, W*0.03, groundY-5, 400, 75, 7, 48, 0.9);
    drawComicStand(ctx, W*0.7, groundY-5, 300, 70, 6, 38, 0.85);
  } else if(locId==='intl'){ drawComicStand(ctx, W*0.02, groundY-5, 500, 90, 9, 60, 0.95); }
  else { drawComicStand(ctx, W*0.05, groundY-5, 200, 45, 4, 22, 0.7); }

  drawSideInfrastructure(ctx, W, H, groundY, locId, tod);

  const lightCount={airport:2,county:3,national:4,intl:5}[locId]||3;
  for(let i=0;i<lightCount;i++){
    const x=W*(0.1+i*(0.85/lightCount));
    drawComicLightTower(ctx,x,groundY,140);
  }

  ctx.fillStyle='#2a2835'; ctx.fillRect(0,groundY,W,H-groundY);
  ctx.strokeStyle='#0a0a0f'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(0,groundY); ctx.lineTo(W,groundY); ctx.stroke();
  const trackTop=groundY+3, trackBot=H-8;
  ctx.fillStyle='#3a3a48'; ctx.fillRect(0,trackTop,W,trackBot-trackTop);
  drawHalftone(ctx, 0, trackTop, W, trackBot-trackTop, 8, 'rgba(0,0,0,0.08)');
  for(let i=0;i<30;i++){
    const x = 120 + i * ((W - 180) / 30);
    ctx.fillStyle='rgba(0,0,0,0.4)';
    ctx.fillRect(x, trackTop + 25, 4, 3); ctx.fillRect(x, trackBot - 30, 4, 3);
  }
  ctx.strokeStyle='#fff'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(0,trackTop); ctx.lineTo(W,trackTop); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,trackBot); ctx.lineTo(W,trackBot); ctx.stroke();
  ctx.strokeStyle='#ffd60a'; ctx.lineWidth=4; ctx.setLineDash([30, 20]);
  ctx.beginPath(); ctx.moveTo(0, (trackTop+trackBot)/2); ctx.lineTo(W, (trackTop+trackBot)/2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle='#fff'; ctx.lineWidth=6;
  ctx.beginPath(); ctx.moveTo(120, trackTop); ctx.lineTo(120, trackBot); ctx.stroke();
  ctx.strokeStyle='#ff6b1a'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(123, trackTop); ctx.lineTo(123, trackBot); ctx.stroke();

  // ÚJ finishX: hely a stop zónának
  const startX = 120;
  const finishX = W * 0.72;
  const stopEndX = W - 20;

  // Célvonal + kockás
  const cw=16, ch=14;
  for(let y=trackTop;y<trackBot;y+=ch){
    for(let x=finishX-20;x<finishX;x+=cw){
      const i=Math.floor((x-(finishX-20))/cw)+Math.floor((y-trackTop)/ch);
      ctx.fillStyle=i%2?'#000':'#fff';
      ctx.fillRect(x,y,cw,ch);
    }
  }
  ctx.strokeStyle='#ffd60a'; ctx.lineWidth=5;
  ctx.beginPath(); ctx.moveTo(finishX,trackTop); ctx.lineTo(finishX,trackBot); ctx.stroke();
  ctx.strokeStyle='#0a0a0f'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(finishX+2,trackTop); ctx.lineTo(finishX+2,trackBot); ctx.stroke();

  // "CÉL" felirat a stop zóna fölé
  ctx.fillStyle='rgba(255,45,85,0.85)';
  ctx.font='bold 14px Impact, sans-serif';
  ctx.textAlign='center';
  ctx.fillText('STOP ZÓNA ▶', (finishX + stopEndX) / 2, trackTop + 20);
  ctx.textAlign='left';

  ctx.fillStyle='rgba(255,107,26,0.15)';
  ctx.font='bold 50px Impact, sans-serif'; ctx.textAlign='center';
  ctx.fillText('1/4 MILE',startX + (finishX - startX)*0.5, H*0.5);
  ctx.textAlign='left';

  drawChristmasTree(ctx,110,trackTop+20);

  // stopProgress
  const stopPr = (state.phase === 'finish' && state.stopProgress) ? state.stopProgress : 0;

  // Chute-ok
  drawSideChute(ctx,W,H,pA,finishX,stopEndX,startX,state.m.a.d.livery.color,0,state,'a');
  drawSideChute(ctx,W,H,pB,finishX,stopEndX,startX,state.m.b.d.livery.color,1,state,'b');

  // Helper: car X számítás
  function carScreenX(p, stopProgress){
    if(p >= 0.999 && stopProgress > 0){
      const decel = 1 - Math.pow(1 - clamp(stopProgress, 0, 1), 2.5);
      return finishX + (stopEndX - finishX) * decel;
    }
    return startX + (finishX - startX) * p;
  }

  /* A autó */
  {
    const p=pA, lane=0;
    const laneH=(trackBot-trackTop)/2;
    const baseY=trackTop+laneH*(lane+0.5)+8;
    const x = carScreenX(p, stopPr);
    const wheelie=p<0.05&&state.running?(1-p/0.05)*3:0;
    const stuck = state.m.a.run && state.m.a.run.stuck;
    const slideOff = state.m.a.run && state.m.a.run.slideOff;
    let slideY = 0, slideRot = 0;
    if(slideOff && state.phase === 'run'){
      const sp = clamp((p - 0.4) / 0.35, 0, 1);
      slideY = sp * 15;
      slideRot = sp * 0.25;
    }
    if(state.burnout && !stuck){
      const d=state.m.a.d;
      const wp=getWheelPositions(d.catRef.bodyType);
      const dsm=d.fuel==='diesel';
      if(d.drivetrain==='RWD' || d.drivetrain==='AWD'){
        drawBurnoutSmoke(ctx, x+wp.rearX, baseY+2, d.livery.color, dsm, 1.4);
      }
      if(d.drivetrain==='FWD' || d.drivetrain==='AWD'){
        drawBurnoutSmoke(ctx, x+wp.frontX, baseY+10, d.livery.color, dsm, 1.0);
      }
    }
    ctx.save();
    ctx.translate(x, baseY-wheelie + slideY);
    if(slideRot) ctx.rotate(slideRot);
    drawComicCar(ctx, {p, side:'a', state});
    ctx.restore();
  }

  /* B autó */
  {
    const p=pB, lane=1;
    const laneH=(trackBot-trackTop)/2;
    const baseY=trackTop+laneH*(lane+0.5)+8;
    const x = carScreenX(p, stopPr);
    const wheelie=p<0.05&&state.running?(1-p/0.05)*3:0;
    const stuck = state.m.b.run && state.m.b.run.stuck;
    const slideOff = state.m.b.run && state.m.b.run.slideOff;
    let slideY = 0, slideRot = 0;
    if(slideOff && state.phase === 'run'){
      const sp = clamp((p - 0.4) / 0.35, 0, 1);
      slideY = sp * 15;
      slideRot = sp * 0.25;
    }
    if(state.burnout && !stuck){
      const d=state.m.b.d;
      const wp=getWheelPositions(d.catRef.bodyType);
      const dsm=d.fuel==='diesel';
      if(d.drivetrain==='RWD' || d.drivetrain==='AWD'){
        drawBurnoutSmoke(ctx, x+wp.rearX, baseY+2, d.livery.color, dsm, 1.4);
      }
      if(d.drivetrain==='FWD' || d.drivetrain==='AWD'){
        drawBurnoutSmoke(ctx, x+wp.frontX, baseY+10, d.livery.color, dsm, 1.0);
      }
    }
    ctx.save();
    ctx.translate(x, baseY-wheelie + slideY);
    if(slideRot) ctx.rotate(slideRot);
    drawComicCar(ctx, {p, side:'b', state});
    ctx.restore();
  }
  drawFixedHUD(ctx, W, H, state, pA, pB);
  if(state.phase === 'finish' && state.scoreProgress > 0){
    drawDigitalScoreboard(ctx, W, H, state.m, state.scoreProgress);
  }
}
function drawComicSky(ctx, W, H, groundY, tod){
  const sky=ctx.createLinearGradient(0,0,0,groundY);
  if(tod==='day'){
    sky.addColorStop(0,'#00b4ff'); sky.addColorStop(0.5,'#66d0ff');
    sky.addColorStop(0.85,'#ffd60a'); sky.addColorStop(1,'#ff8a30');
  } else {
    sky.addColorStop(0,'#1a0530'); sky.addColorStop(0.5,'#5a1430'); sky.addColorStop(1,'#c93a35');
  }
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,groundY);
  drawHalftone(ctx, 0, 0, W, groundY, 10, 'rgba(0,0,0,0.06)');
  const cx = W * 0.8, cy = H * 0.15, r = 45;
  if(tod === 'day'){
    for(let i=0;i<12;i++){
      const a = (i/12) * Math.PI * 2 + Date.now() * 0.0003;
      const r1 = r + 8, r2 = r + 25 + Math.sin(Date.now()*0.002 + i) * 5;
      ctx.strokeStyle = '#ffd60a'; ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a)*r1, cy + Math.sin(a)*r1);
      ctx.lineTo(cx + Math.cos(a)*r2, cy + Math.sin(a)*r2);
      ctx.stroke();
    }
    ctx.fillStyle='#ffd60a'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
    ctx.strokeStyle='#0a0a0f'; ctx.lineWidth=4; ctx.stroke();
    ctx.fillStyle='#0a0a0f';
    ctx.beginPath(); ctx.arc(cx-12, cy-8, 4, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+12, cy-8, 4, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy+8, 15, 0, Math.PI); ctx.stroke();
  } else {
    ctx.fillStyle='#fff8e0'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
    ctx.strokeStyle='#0a0a0f'; ctx.lineWidth=4; ctx.stroke();
    ctx.fillStyle='rgba(140,120,90,0.5)';
    ctx.beginPath(); ctx.arc(cx-15, cy-10, 6, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+10, cy+8, 8, 0, 7); ctx.fill();
    for(let i=0;i<60;i++){
      const sx = (i*173.3+7)%W, sy = (i*71.7+3)%(groundY*0.8);
      const size = 2 + (i%3);
      const tw = 0.4 + 0.6 * Math.abs(Math.sin(Date.now()*0.001 + i));
      ctx.fillStyle = `rgba(255,255,255,${tw})`;
      ctx.beginPath(); ctx.arc(sx, sy, size, 0, 7); ctx.fill();
      ctx.strokeStyle = `rgba(10,10,15,${tw})`; ctx.lineWidth = 1.5; ctx.stroke();
    }
  }
}
function drawComicBackground(ctx, W, H, groundY, locId, tod){
  if(locId==='airport' || locId==='national' || locId==='intl'){
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W, groundY); ctx.clip();
    const buildings = getComicBuildings(W);
    const now = Date.now();
    const palette = tod==='day' ? BUILDING_COLORS_DAY : BUILDING_COLORS_NIGHT;
    buildings.forEach((b, i)=>{
      ctx.fillStyle = palette[i % palette.length];
      ctx.fillRect(b.x, groundY - b.h, b.w, b.h);
      ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 3;
      ctx.strokeRect(b.x, groundY - b.h, b.w, b.h);
      ctx.fillStyle = tod==='day' ? 'rgba(255,255,255,0.15)' : 'rgba(255,180,80,0.15)';
      ctx.fillRect(b.x, groundY - b.h, b.w, 3);
      for(let wy = groundY - b.h + 6; wy < groundY - 10; wy += 14){
        for(let wx = b.x + 5; wx < b.x + b.w - 8; wx += 12){
          const winIdx = Math.floor((wy - (groundY - b.h)) / 14) * 30 + Math.floor((wx - b.x) / 12);
          const lit = (i*3 + winIdx) % 3 === 0;
          if(lit){
            const twinkle = 0.55 + 0.45 * Math.abs(Math.sin(now * 0.0018 + winIdx * 0.7 + i * 1.3));
            ctx.fillStyle = tod==='day' ? `rgba(184, 208, 232, ${twinkle})` : `rgba(255, 214, 10, ${twinkle})`;
            ctx.fillRect(wx, wy, 6, 8);
            ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 1; ctx.strokeRect(wx, wy, 6, 8);
          } else {
            ctx.fillStyle = tod==='day' ? '#3a3a4a' : '#0a0a12';
            ctx.fillRect(wx, wy, 6, 8);
            ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 1; ctx.strokeRect(wx, wy, 6, 8);
          }
        }
      }
      if(b.antennaType === 1){
        ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(b.x + b.w/2, groundY - b.h); ctx.lineTo(b.x + b.w/2, groundY - b.h - 15); ctx.stroke();
        const blink = Math.sin(now * 0.004 + i) > 0 ? 1 : 0.15;
        ctx.fillStyle = `rgba(255, 50, 50, ${blink})`;
        ctx.beginPath(); ctx.arc(b.x + b.w/2, groundY - b.h - 17, 3, 0, 7); ctx.fill();
        ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 1.5; ctx.stroke();
      } else if(b.antennaType === 2){
        ctx.fillStyle = tod==='day' ? '#4a4a5a' : '#1a1a28';
        ctx.fillRect(b.x + b.w/2 - 6, groundY - b.h - 10, 12, 10);
        ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2;
        ctx.strokeRect(b.x + b.w/2 - 6, groundY - b.h - 10, 12, 10);
        ctx.fillStyle = tod==='day' ? '#5a5a6a' : '#252535';
        ctx.beginPath();
        ctx.moveTo(b.x + b.w/2 - 7, groundY - b.h - 10);
        ctx.lineTo(b.x + b.w/2, groundY - b.h - 14);
        ctx.lineTo(b.x + b.w/2 + 7, groundY - b.h - 10);
        ctx.closePath(); ctx.fill(); ctx.stroke();
      }
    });
    ctx.restore();
  } else if(locId==='county'){
    for(let i=0;i<10;i++){
      const tx = (i * 137 + 40) % W;
      ctx.fillStyle = '#0a5a20';
      ctx.beginPath();
      ctx.moveTo(tx, groundY - 60); ctx.lineTo(tx - 25, groundY - 15); ctx.lineTo(tx + 25, groundY - 15);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = '#3a2a15'; ctx.fillRect(tx - 4, groundY - 18, 8, 18);
      ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2.5; ctx.strokeRect(tx - 4, groundY - 18, 8, 18);
    }
  }
  if(locId==='airport'){
    const t = Date.now() * 0.00005;
    const p1x = ((t * 40) % (W+400)) - 200;
    const p1y = H * 0.14;
    ctx.save(); ctx.translate(p1x, p1y);
    ctx.fillStyle = '#e8e8f4'; ctx.beginPath(); ctx.ellipse(0, 0, 35, 5, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 3; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-2, 0); ctx.lineTo(-15, -12); ctx.lineTo(-8, -12); ctx.lineTo(6, 0);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  drawDrone(ctx, W, H, groundY);
}
function drawDrone(ctx, W, H, groundY){
  const t = Date.now() * 0.0003;
  const dx = W * 0.5 + Math.sin(t) * W * 0.15;
  const dy = H * 0.1 + Math.cos(t * 1.3) * 12;
  ctx.save(); ctx.translate(dx, dy);
  ctx.fillStyle = '#2a2a35'; ctx.beginPath(); ctx.roundRect(-20, -6, 40, 12, 3); ctx.fill();
  ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 3; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-20, -4); ctx.lineTo(-28, -10); ctx.moveTo(20, -4); ctx.lineTo(28, -10); ctx.stroke();
  const blur = 4 + Math.sin(Date.now()*0.02) * 3;
  ctx.fillStyle = 'rgba(150,150,160,0.4)';
  ctx.beginPath(); ctx.ellipse(-28, -10, blur, 2, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(28, -10, blur, 2, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#ff2d55'; ctx.beginPath(); ctx.arc(-18, 0, 2, 0, 7); ctx.fill();
  ctx.fillStyle = '#00c853'; ctx.beginPath(); ctx.arc(18, 0, 2, 0, 7); ctx.fill();
  ctx.restore();
}
function drawComicStand(ctx, x, y, w, h, rows, cols, intensity){
  ctx.fillStyle='#8a5a20'; ctx.fillRect(x, y-h, w, h);
  ctx.strokeStyle='#0a0a0f'; ctx.lineWidth = 4; ctx.strokeRect(x, y-h, w, h);
  for(let r=0;r<rows;r++){
    ctx.fillStyle = r%2 ? '#a06028' : '#8a5a20';
    ctx.fillRect(x+2, y-h+2 + r*(h/rows), w-4, h/rows - 4);
    ctx.strokeStyle='#0a0a0f'; ctx.lineWidth = 1.5;
    ctx.strokeRect(x+2, y-h+2 + r*(h/rows), w-4, h/rows - 4);
    const rowY = y-h+2 + r*(h/rows) + (h/rows)/2;
    const colors = ['#ff2d55','#00b4ff','#ffd60a','#fff','#8e44ad','#00c853','#ff6b1a'];
    for(let c = 0; c < cols; c++){
      const cx = x + 8 + c * (w - 16) / cols;
      const rr = seededRand(cx*0.1 + r*1.7 + x*0.01);
      if(rr > intensity) continue;
      const seed = (c + r * 7) % colors.length;
      ctx.fillStyle = colors[seed];
      ctx.beginPath(); ctx.arc(cx, rowY - 3, 4, 0, 7); ctx.fill();
      ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = '#ffd9b8';
      ctx.beginPath(); ctx.arc(cx, rowY - 8, 3, 0, 7); ctx.fill();
      ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 1; ctx.stroke();
    }
  }
  ctx.fillStyle='#5a2a10';
  ctx.beginPath();
  ctx.moveTo(x-8, y-h); ctx.lineTo(x+w+8, y-h);
  ctx.lineTo(x+w, y-h+10); ctx.lineTo(x, y-h+10);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#0a0a0f'; ctx.lineWidth=4; ctx.stroke();
}
function drawComicLightTower(ctx, x, baseY, height){
  ctx.fillStyle = '#1a1a28'; ctx.fillRect(x-3, baseY-height, 6, height);
  ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 3; ctx.strokeRect(x-3, baseY-height, 6, height);
  ctx.fillStyle = '#0a0a0f'; ctx.fillRect(x-25, baseY-height-10, 50, 12); ctx.strokeRect(x-25, baseY-height-10, 50, 12);
  for(let j=0;j<4;j++){
    const lx = x - 18 + j * 12;
    const fl = 0.7 + 0.3 * Math.sin(Date.now()*0.003 + j);
    ctx.fillStyle = `rgba(255, 220, 100, ${fl})`;
    ctx.beginPath(); ctx.arc(lx, baseY-height-4, 5, 0, 7); ctx.fill();
    ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2; ctx.stroke();
    const gp = ctx.createRadialGradient(lx, baseY-height-4, 0, lx, baseY-height-4, 30);
    gp.addColorStop(0, `rgba(255,220,100,${0.5*fl})`);
    gp.addColorStop(1, 'rgba(255,220,100,0)');
    ctx.fillStyle = gp; ctx.fillRect(lx-30, baseY-height-34, 60, 60);
  }
}
function drawSideInfrastructure(ctx, W, H, groundY, locId, tod){
  const week = G.event ? G.event.setup.week : 1;

  const booths = getBoothsForRace(W, locId, week);
  ctx.textAlign = 'center';
  booths.forEach((b, i) => {
    const bx = 40 + i * ((W - 80) / booths.length);
    const y = groundY - b.h;
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(bx + 3, y + 4, b.w, b.h);
    ctx.fillStyle = b.color.bg;
    ctx.fillRect(bx, y, b.w, b.h);
    ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 3;
    ctx.strokeRect(bx, y, b.w, b.h);
    if(b.hasAwning){
      const awnH = 9;
      for(let k=0;k<b.w;k+=10){
        ctx.fillStyle = (Math.floor(k/10))%2 ? b.color.trim : b.color.bg;
        ctx.fillRect(bx + k, y - awnH, Math.min(10, b.w - k), awnH);
      }
      ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2.5;
      ctx.strokeRect(bx, y - awnH, b.w, awnH);
    }
    ctx.fillStyle = '#0a0a0f'; ctx.fillRect(bx + 4, y + 6, b.w - 8, 13);
    ctx.fillStyle = b.color.trim;
    ctx.font = 'bold 8px Impact, sans-serif';
    ctx.fillText(b.sign, bx + b.w/2, y + 15);
    ctx.fillStyle = 'rgba(150,210,255,0.55)';
    ctx.fillRect(bx + 6, y + 24, 13, 10);
    ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2;
    ctx.strokeRect(bx + 6, y + 24, 13, 10);
    ctx.beginPath(); ctx.moveTo(bx + 12.5, y + 24); ctx.lineTo(bx + 12.5, y + 34); ctx.stroke();
    ctx.fillStyle = '#1a1a1a'; ctx.fillRect(bx + b.w - 20, y + 24, 14, b.h - 24);
    ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2;
    ctx.strokeRect(bx + b.w - 20, y + 24, 14, b.h - 24);
    ctx.fillStyle = '#ffd60a'; ctx.beginPath(); ctx.arc(bx + b.w - 8, y + b.h - 12, 1.5, 0, 7); ctx.fill();
    if(b.hasFlag){
      ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(bx + b.w - 10, y - (b.hasAwning?9:0));
      ctx.lineTo(bx + b.w - 10, y - (b.hasAwning?9:0) - 16);
      ctx.stroke();
      const wave = Math.sin(Date.now() * 0.005 + bx) * 2;
      ctx.fillStyle = b.color.bg;
      ctx.beginPath();
      ctx.moveTo(bx + b.w - 10, y - (b.hasAwning?9:0) - 16);
      ctx.lineTo(bx + b.w + 6 + wave, y - (b.hasAwning?9:0) - 13);
      ctx.lineTo(bx + b.w + 6 + wave, y - (b.hasAwning?9:0) - 5);
      ctx.lineTo(bx + b.w - 10, y - (b.hasAwning?9:0) - 3);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 1.5; ctx.stroke();
    }
  });

  const crowd = getCrowdForRace(W, groundY, locId, week);
  const tSec = Date.now() * 0.001;
  crowd.forEach(c => {
    const bob = Math.sin(tSec * 2.2 + c.bobSeed) * 1.6;
    const feetY = groundY - 4 + c.yOff + bob;
    const s = c.scale;
    ctx.fillStyle = c.color;
    ctx.beginPath(); ctx.arc(c.x, feetY - 6*s, 4*s, 0, 7); ctx.fill();
    ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.fillStyle = c.skin;
    ctx.beginPath(); ctx.arc(c.x, feetY - 12*s, 3.2*s, 0, 7); ctx.fill();
    ctx.stroke();
    if((Math.floor(c.x) % 5) === 0){
      ctx.strokeStyle = c.skin; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(c.x - 3*s, feetY - 6*s);
      ctx.lineTo(c.x - 6*s, feetY - 14*s + bob);
      ctx.stroke();
      ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 1; ctx.stroke();
    }
  });

  const carColors = ['#ff2d55','#00b4ff','#ffd60a','#00c853','#8e44ad','#ff6b1a','#fff'];
  for(let i=0;i<12;i++){
    if(i % 4 === 0) continue;
    const x = (i * 173 + 60) % W;
    const y = groundY - 18 + (i % 3) * 3;
    const c = carColors[i % carColors.length];
    ctx.fillStyle = c; ctx.fillRect(x, y, 22, 9);
    ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2.5; ctx.strokeRect(x, y, 22, 9);
    ctx.fillStyle = '#4aa8ff'; ctx.fillRect(x + 5, y + 2, 12, 4);
    ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 1.5; ctx.strokeRect(x + 5, y + 2, 12, 4);
    ctx.fillStyle = '#0a0a0f';
    ctx.beginPath(); ctx.arc(x + 6, y + 10, 2.5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 16, y + 10, 2.5, 0, 7); ctx.fill();
  }
  ctx.textAlign='left';
}

/* ==================================================================
   DRÓN 3/4 NÉZET
   ================================================================== */
function drawDroneIntroView(ctx, W, H, pA, pB, state){
  const tod   = G.event?.timeOfDay || 'night';
  const locId = G.event?.loc.id || 'county';
  const week  = G.event?.setup.week || 1;
  const tSec  = Date.now() * 0.001;

  const camX = W * 0.5;
  const horizonY = H * 0.30;

  /* Ég 0..horizonY */
  const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
  if(tod==='day'){
    skyGrad.addColorStop(0, '#00b4ff'); skyGrad.addColorStop(0.7, '#7dd0ff'); skyGrad.addColorStop(1, '#ffd60a');
  } else {
    skyGrad.addColorStop(0, '#0a0420'); skyGrad.addColorStop(0.7, '#3a1050'); skyGrad.addColorStop(1, '#7a1a40');
  }
  ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, W, horizonY);

  /* Talaj horizonY..H */
  ctx.fillStyle = tod==='day' ? '#3a6a3a' : '#0a1a10';
  ctx.fillRect(0, horizonY, W, H - horizonY);

  /* Perspektíva: p=0 → y=H, p=1 → y=horizonY+20 */
  const topY = horizonY + 20;
  const botY = H;
  const worldToY = p => botY - (botY - topY) * clamp(p, 0, 1);
  const widthAt = y => {
    const t = clamp((y - horizonY) / (botY - horizonY), 0, 1);
    return W * (0.10 + 0.80 * t);
  };

  /* Pálya trapéz – topY-tól H-ig (nem lóg a levegőben!) */
  const topW = widthAt(topY);
  const botW = widthAt(botY);
  ctx.fillStyle = tod==='day' ? '#4a4855' : '#2a2a35';
  ctx.beginPath();
  ctx.moveTo(camX - topW/2, topY);
  ctx.lineTo(camX + topW/2, topY);
  ctx.lineTo(camX + botW/2, botY);
  ctx.lineTo(camX - botW/2, botY);
  ctx.closePath(); ctx.fill();
  drawHalftone(ctx, 0, topY, W, botY - topY, 6, 'rgba(0,0,0,0.08)');

  /* Oldalvonalak */
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(camX - topW/2, topY); ctx.lineTo(camX - botW/2, botY);
  ctx.moveTo(camX + topW/2, topY); ctx.lineTo(camX + botW/2, botY);
  ctx.stroke();

  /* Középvonal */
  ctx.strokeStyle = '#ffd60a'; ctx.lineWidth = 3; ctx.setLineDash([14, 10]);
  ctx.beginPath(); ctx.moveTo(camX, topY); ctx.lineTo(camX, botY); ctx.stroke();
  ctx.setLineDash([]);

  /* Távolságjelzők */
  ctx.font = 'bold 11px Impact, monospace';
  ctx.textAlign = 'center';
  for(let d = 0; d <= 402; d += 50){
    const y = worldToY(d / 402);
    if(y < horizonY + 5 || y > H + 5) continue;
    const wAt = widthAt(y);
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(camX - wAt/2, y); ctx.lineTo(camX + wAt/2, y); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fillText(d + 'm', camX - wAt/2 - 28, y + 4);
  }
  ctx.textAlign = 'left';

  /* Rajt és cél kockás */
  [0, 1].forEach(p => {
    const y = worldToY(p);
    if(y < horizonY - 20 || y > H + 20) return;
    const wAt = widthAt(y);
    const numSq = 16, sqW = wAt / numSq;
    for(let i = 0; i < numSq; i++){
      ctx.fillStyle = i % 2 ? '#000' : '#fff';
      ctx.fillRect(camX - wAt/2 + i * sqW, y - 4, sqW, 8);
    }
    ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2;
    ctx.strokeRect(camX - wAt/2, y - 4, wAt, 8);
  });

  /* Bódék a pálya két széle mentén */
  const booths = getBoothsForRace(W, locId, week);
  booths.forEach((b, i) => {
    const p = 0.15 + (i / booths.length) * 0.65;
    if(p > 1) return;
    const y = worldToY(p);
    if(y < horizonY - 30 || y > H + 30) return;
    const wAt = widthAt(y);
    const side = (i % 2 === 0) ? -1 : 1;
    const bx = camX + side * (wAt/2 + 20 + (i%3)*6);
    const sc = 0.20 + 1.1 * clamp((y - horizonY) / (H - horizonY), 0, 1);
    drawPerspectiveBooth(ctx, bx, y, b, sc);
  });

  /* Nézők szintén a pálya széle mentén */
  const crowd = getCrowdForRace(W, 0, locId, week);
  crowd.forEach((c, i) => {
    const p = (i + 0.5) / crowd.length;
    const y = worldToY(p);
    if(y < horizonY - 20 || y > H + 20) return;
    const wAt = widthAt(y);
    const left = i % 2 === 0;
    const x = camX + (left ? -1 : 1) * (wAt/2 + 6 + seededRand(i) * 10);
    const sc = 0.12 + 0.9 * clamp((y - horizonY) / (H - horizonY), 0, 1);
    const bob = Math.sin(tSec * 2.5 + c.bobSeed) * 1.6 * sc;
    drawPerspectiveSpectator(ctx, x, y + bob, c, sc);
  });

  /* Autók – hátsó/oldalsó nézetben */
  const cars = [
    { side:'a', p:pA, lane:-1 },
    { side:'b', p:pB, lane: 1 }
  ].sort((a,b) => a.p - b.p);
  cars.forEach(car => {
    const carY = worldToY(car.p);
    if(carY < horizonY - 60 || carY > H + 60) return;
    const d = car.side === 'a' ? state.m.a.d : state.m.b.d;
    const wAt = widthAt(carY);
    const cx = camX + car.lane * wAt * 0.22;
    const sc = 0.22 + 1.0 * clamp((carY - horizonY) / (H - horizonY), 0, 1);
    drawIsometricCar(ctx, cx, carY, sc, d, state, car.side);
  });

  /* REC overlay */
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(W - 110, 20, 90, 26);
  ctx.strokeStyle = '#ff2d55'; ctx.lineWidth = 2;
  ctx.strokeRect(W - 110, 20, 90, 26);
  if(Math.sin(Date.now() * 0.006) > 0){
    ctx.fillStyle = '#ff2d55';
    ctx.beginPath(); ctx.arc(W - 96, 33, 5, 0, 7); ctx.fill();
  }
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 12px Impact';
  ctx.fillText('REC', W - 82, 38);

  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(W/2 - 110, 15, 220, 30);
  ctx.strokeStyle = '#ffd60a'; ctx.lineWidth = 3;
  ctx.strokeRect(W/2 - 110, 15, 220, 30);
  ctx.fillStyle = '#ffd60a';
  ctx.font = 'bold 16px Impact, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('🚁 3/4 DRÓN NÉZET', W/2, 36);
  ctx.textAlign = 'left';

  drawFixedHUD(ctx, W, H, state, pA, pB);
  if(state.phase === 'finish' && state.scoreProgress > 0){
    drawDigitalScoreboard(ctx, W, H, state.m, state.scoreProgress);
  }
}

function drawPerspectiveBooth(ctx, x, y, b, scale){
  ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
  const bw = 42, bh = 26;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(-bw/2 + 2, -bh + 3, bw, bh);
  ctx.fillStyle = b.color.bg;
  ctx.fillRect(-bw/2, -bh, bw, bh);
  ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2.5;
  ctx.strokeRect(-bw/2, -bh, bw, bh);
  if(b.hasAwning){
    for(let i = 0; i < bw; i += 7){
      ctx.fillStyle = (Math.floor(i/7))%2 ? b.color.trim : b.color.bg;
      ctx.fillRect(-bw/2 + i, -bh - 6, 7, 6);
    }
    ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2;
    ctx.strokeRect(-bw/2, -bh - 6, bw, 6);
  }
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(-bw/2 + 3, -bh + 5, bw - 6, 7);
  ctx.fillStyle = b.color.trim;
  ctx.font = 'bold 5px Impact, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(b.sign, 0, -bh + 10);
  ctx.textAlign = 'left';
  ctx.restore();
}
function drawPerspectiveSpectator(ctx, x, y, c, scale){
  ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
  ctx.fillStyle = c.color;
  ctx.beginPath(); ctx.arc(0, -6, 4, 0, 7); ctx.fill();
  ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = c.skin;
  ctx.beginPath(); ctx.arc(0, -12, 3, 0, 7); ctx.fill();
  ctx.stroke();
  ctx.restore();
}
function drawIsometricCar(ctx, x, y, scale, d, state, side){
  ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
  const color  = d.livery.color;
  const color2 = d.livery.color2;
  const bfActive = state.backfire && state.backfire[side] > 0 && state.backfire[side] < 0.35;
  const stuck = state.m[side].run && state.m[side].run.stuck;

  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.ellipse(0, 25, 30, 6, 0, 0, 7); ctx.fill();

  ctx.fillStyle = '#0a0a0f';
  ctx.beginPath(); ctx.ellipse(-24, 20, 8, 14, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 3; ctx.stroke();
  ctx.beginPath(); ctx.ellipse( 24, 20, 8, 14, 0, 0, 7); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(-16, -22, 5, 7, 0, 0, 7); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse( 16, -22, 5, 7, 0, 0, 7); ctx.fill(); ctx.stroke();

  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, -38);
  ctx.lineTo(-10, -22); ctx.lineTo(-14, -5);
  ctx.lineTo(-16, 10);  ctx.lineTo(-18, 28);
  ctx.lineTo( 18, 28);  ctx.lineTo( 16, 10);
  ctx.lineTo( 14, -5);  ctx.lineTo( 10, -22);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 3; ctx.stroke();

  ctx.fillStyle = shade(color, 60);
  ctx.beginPath();
  ctx.moveTo(0, -36); ctx.lineTo(-8, -20);
  ctx.lineTo(-12, 10); ctx.lineTo(-14, 24);
  ctx.lineTo(-4, 24); ctx.lineTo(-2, -20);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = '#4aa8ff';
  ctx.beginPath();
  ctx.moveTo(-8, 20); ctx.lineTo(-6, 8);
  ctx.lineTo( 6,  8); ctx.lineTo( 8, 20);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(-6, 10, 5, 8);

  if(color2){
    if(d.livery.hasStripes){
      ctx.fillStyle = color2; ctx.fillRect(-2, -36, 4, 60);
      ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 1.5; ctx.strokeRect(-2, -36, 4, 60);
    } else if(d.livery.hasTwoTone){
      ctx.fillStyle = color2; ctx.fillRect(-16, 10, 32, 4);
      ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 1.5; ctx.strokeRect(-16, 10, 32, 4);
    }
  }
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, -10, 8, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#0a0a0f';
  ctx.font = 'bold 9px Impact'; ctx.textAlign = 'center';
  ctx.fillText(d.car, 0, -7); ctx.textAlign = 'left';

  const bt = d.catRef.bodyType;
  if(bt !== 'sedan' && bt !== 'tuned'){
    ctx.fillStyle = '#333'; ctx.fillRect(-22, 30, 44, 6);
    ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2;
    ctx.strokeRect(-22, 30, 44, 6);
    ctx.beginPath();
    ctx.moveTo(-14, 30); ctx.lineTo(-14, 26);
    ctx.moveTo( 14, 30); ctx.lineTo( 14, 26);
    ctx.stroke();
  }
  if(stuck && state.phase === 'run'){
    ctx.fillStyle = '#ff2d55';
    ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2;
    ctx.font = 'bold 12px Impact, sans-serif';
    ctx.textAlign = 'center';
    ctx.strokeText('STUCK', 0, -50); ctx.fillText('STUCK', 0, -50);
    ctx.textAlign = 'left';
  }
  if((state.running || state.burnout || bfActive) && !stuck){
    const sizes = bfActive ? [30, 28, 25] : [15, 12, 18];
    for(let i = 0; i < 3; i++){
      const fx = -14 + i * 14;
      const fl = sizes[i] + Math.sin(Date.now()*0.025 + i) * 4;
      const g = ctx.createRadialGradient(fx, 30, 0, fx, 30, fl);
      g.addColorStop(0, '#fff'); g.addColorStop(0.3, '#ffd60a');
      g.addColorStop(0.7, '#ff6b1a'); g.addColorStop(1, 'rgba(255,45,85,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(fx - 5, 30); ctx.lineTo(fx, 30 + fl); ctx.lineTo(fx + 5, 30);
      ctx.closePath(); ctx.fill();
    }
  }
  ctx.restore();
}

/* ==================================================================
   STÁB NÉZET
   ================================================================== */
function drawCrewView(ctx,W,H,pA,pB,state){
  const tod = G.event?.timeOfDay || 'night';
  const locId = G.event?.loc.id || 'county';
  const weekC = G.event ? G.event.setup.week : 1;
  const horizonY=H*0.32;
  drawComicSky(ctx, W, H, horizonY, tod);

  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, horizonY); ctx.clip();
  const buildings = getComicBuildings(W);
  const now = Date.now();
  const palette = tod==='day' ? BUILDING_COLORS_DAY : BUILDING_COLORS_NIGHT;
  buildings.forEach((b, i) => {
    ctx.fillStyle = palette[i % palette.length];
    ctx.fillRect(b.x, horizonY - b.h * 0.6, b.w, b.h * 0.6);
    ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2;
    ctx.strokeRect(b.x, horizonY - b.h * 0.6, b.w, b.h * 0.6);
    for(let wy = horizonY - b.h * 0.6 + 4; wy < horizonY - 4; wy += 8){
      for(let wx = b.x + 3; wx < b.x + b.w - 5; wx += 7){
        const winIdx = Math.floor(wy/8) * 30 + Math.floor(wx/7);
        if((i + winIdx) % 3 === 0){
          const tw = 0.5 + 0.5 * Math.abs(Math.sin(now * 0.002 + winIdx));
          ctx.fillStyle = tod==='day' ? `rgba(184, 208, 232, ${tw})` : `rgba(255, 214, 10, ${tw})`;
          ctx.fillRect(wx, wy, 3, 4);
        }
      }
    }
  });
  ctx.restore();

  const gnd=ctx.createLinearGradient(0,horizonY,0,H);
  if(tod==='day'){ gnd.addColorStop(0,'#5a5865'); gnd.addColorStop(1,'#3a3a48'); }
  else { gnd.addColorStop(0,'#1a1a25'); gnd.addColorStop(1,'#0a0a10'); }
  ctx.fillStyle=gnd; ctx.fillRect(0,horizonY,W,H-horizonY);
  ctx.strokeStyle='#0a0a0f'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(0,horizonY); ctx.lineTo(W,horizonY); ctx.stroke();

  const trackCenter=W/2;
  const trackTopW=W*0.12;
  const trackBotW=W*0.85;

  ctx.fillStyle = tod==='day' ? '#4a4855' : '#2a2a35';
  ctx.beginPath();
  ctx.moveTo(trackCenter-trackTopW/2,horizonY);
  ctx.lineTo(trackCenter+trackTopW/2,horizonY);
  ctx.lineTo(trackCenter+trackBotW/2,H);
  ctx.lineTo(trackCenter-trackBotW/2,H);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#0a0a0f'; ctx.lineWidth=3; ctx.stroke();

  /* Oldalvonalak */
  ctx.strokeStyle='#fff'; ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(trackCenter-trackTopW/2,horizonY);
  ctx.lineTo(trackCenter-trackBotW/2,H);
  ctx.moveTo(trackCenter+trackTopW/2,horizonY);
  ctx.lineTo(trackCenter+trackBotW/2,H);
  ctx.stroke();

  /* ÚJ: KÖZÉPSŐ SÁV-ELVÁLASZTÓ */
  ctx.strokeStyle='#ffd60a'; ctx.lineWidth=3;
  ctx.setLineDash([14, 12]);
  ctx.beginPath();
  ctx.moveTo(trackCenter, horizonY);
  ctx.lineTo(trackCenter, H);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle='#0a0a0f'; ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(trackCenter, horizonY);
  ctx.lineTo(trackCenter, H);
  ctx.stroke();

  drawCrewFinishLine(ctx, W, H, horizonY, trackCenter, trackTopW, tod);

  /* Bódék a pálya széle mentén (nem a távolban!) */
  const bC = getBoothsForRace(W, locId, weekC);
  bC.forEach((b, i) => {
    const depthRatio = 0.25 + (i / bC.length) * 0.55;
    const y = horizonY + (H - horizonY) * depthRatio;
    const wAt = trackTopW + (trackBotW - trackTopW) * depthRatio;
    const side = i % 2 === 0 ? -1 : 1;
    const bx = trackCenter + side * (wAt/2 + 25 + (i%3) * 8);
    const sc = 0.35 + depthRatio * 1.6;
    if(bx < 15 || bx > W - 15) return;
    drawPerspectiveBooth(ctx, bx, y, b, sc);
  });

  /* Nézők a pálya két széle mellett */
  const crC = getCrowdForRace(W, horizonY, locId, weekC);
  crC.forEach((c, i) => {
    const depthRatio = 0.15 + ((i * 37) % 100) / 100 * 0.7;
    const y = horizonY + (H - horizonY) * depthRatio;
    const wAt = trackTopW + (trackBotW - trackTopW) * depthRatio;
    const side = i % 2 === 0 ? -1 : 1;
    const x = trackCenter + side * (wAt/2 + 8 + (i % 5) * 4);
    const sc = 0.30 + depthRatio * 1.1;
    if(x < 10 || x > W - 10) return;
    drawPerspectiveSpectator(ctx, x, y, c, sc);
  });

  /* Távolságjelzők */
  ctx.font='bold 11px Impact, monospace';
  ctx.textAlign = 'center';
  [50,100,150,200,250,300].forEach(dist=>{
    const t = dist/402;
    const y = horizonY + (H - horizonY) * t;
    const wAt = trackTopW + (trackBotW-trackTopW) * t;
    ctx.fillStyle = tod==='day' ? 'rgba(0,0,0,0.5)' : 'rgba(255,255,255,0.5)';
    ctx.fillText(dist+'m', trackCenter + wAt/2 + 25, y);
    ctx.strokeStyle = tod==='day' ? 'rgba(0,0,0,0.3)' : 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(trackCenter - wAt/2, y); ctx.lineTo(trackCenter + wAt/2, y); ctx.stroke();
  });
  ctx.textAlign='left';

  const startY = H - 25;
  const startW = trackBotW;
  const sw = startW / 30;
  for(let i=0;i<30;i++){
    ctx.fillStyle=i%2?'#000':'#fff';
    ctx.fillRect(trackCenter-startW/2 + i*sw, startY, sw, 12);
  }
  ctx.strokeStyle='#ff6b1a'; ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(trackCenter-startW/2, startY - 3);
  ctx.lineTo(trackCenter+startW/2, startY - 3);
  ctx.stroke();

  const cars=[
    {side:'a', p:pA, offset:-0.25, color:state.m.a.d.livery.color},
    {side:'b', p:pB, offset:0.25, color:state.m.b.d.livery.color}
  ];
  cars.sort((a,b)=>b.p-a.p);
  cars.forEach(c=>{
    drawCrewCarComic(ctx,W,H,c.p,c.offset,c.side,state,horizonY,H,trackTopW,trackBotW,trackCenter,c.color);
  });
  drawFixedHUD(ctx, W, H, state, pA, pB);
  if(state.phase === 'finish' && state.scoreProgress > 0){
    drawDigitalScoreboard(ctx, W, H, state.m, state.scoreProgress);
  }
}
function drawCrewFinishLine(ctx, W, H, horizonY, trackCenter, trackTopW, tod){
  const finishY = horizonY + 6;
  const finishW = trackTopW * 1.8;
  const cw = finishW / 12;
  for(let i=0;i<12;i++){
    ctx.fillStyle = i%2 ? '#fff' : '#000';
    ctx.fillRect(trackCenter - finishW/2 + i*cw, finishY - 4, cw, 4);
    ctx.fillStyle = i%2 ? '#000' : '#fff';
    ctx.fillRect(trackCenter - finishW/2 + i*cw, finishY, cw, 4);
  }
  ctx.fillStyle = '#ff2d55';
  ctx.fillRect(trackCenter - finishW/2 - 20, finishY - 28, finishW + 40, 18);
  ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 3;
  ctx.strokeRect(trackCenter - finishW/2 - 20, finishY - 28, finishW + 40, 18);
  ctx.fillStyle = '#ffd60a';
  ctx.font = 'bold 12px Impact, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('★ FINISH ★', trackCenter, finishY - 14);
  ctx.textAlign = 'left';
}
function drawCrewCarComic(ctx,W,H,p,offset,side,state,horizonY,finishY,trackTopW,trackBotW,trackCenter,color){
  const d=state.m[side].d;
  const invP = 1 - Math.pow(p, 0.85);
  const y = horizonY + (finishY - horizonY) * invP;
  const scale = 0.12 + Math.pow(invP, 1.5) * 1.6;
  const trackW = trackTopW + (trackBotW - trackTopW) * invP;
  const x = trackCenter + offset * trackW * 0.35;
  const color2 = d.livery.color2;
  const stuck = state.m[side].run && state.m[side].run.stuck;
  const slideOff = state.m[side].run && state.m[side].run.slideOff;
  let slideX = 0;
  if(slideOff && state.phase === 'run'){
    slideX = clamp((p - 0.4) / 0.3, 0, 1) * 25 * (offset > 0 ? 1 : -1);
  }
  if(state.burnout && p < 0.05 && !stuck){
    const wp = getWheelPositions(d.catRef.bodyType);
    const dsm = d.fuel==='diesel';
    if(d.drivetrain==='RWD' || d.drivetrain==='AWD'){
      for(let i=0;i<10;i++){
        const sx = x + wp.rearX*scale + (seededRand(i)*60*scale-30*scale);
        const sy = y - 10 - i*8*scale;
        ctx.fillStyle = dsm ? `rgba(40,40,40,${0.7-i*0.06})` : `rgba(255,255,255,${0.7-i*0.06})`;
        ctx.beginPath(); ctx.arc(sx,sy,(15+seededRand(i+30)*15)*scale,0,7); ctx.fill();
      }
    }
  }
  ctx.save();
  ctx.translate(x + slideX, y);
  ctx.scale(scale, scale);
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.ellipse(0, 15, 50, 6, 0, 0, 7); ctx.fill();
  ctx.fillStyle='#0a0a0f';
  ctx.beginPath(); ctx.ellipse(-42, 10, 14, 26, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(42, 10, 14, 26, 0, 0, 7); ctx.fill();
  ctx.strokeStyle='#0a0a0f'; ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle = '#888';
  ctx.beginPath(); ctx.arc(-42, 10, 6, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(42, 10, 6, 0, 7); ctx.fill();
  ctx.strokeStyle='#0a0a0f'; ctx.lineWidth=2; ctx.stroke();
  const bodyGrad=ctx.createLinearGradient(-35,0,35,0);
  bodyGrad.addColorStop(0,shade(color,-40)); bodyGrad.addColorStop(0.5,color); bodyGrad.addColorStop(1,shade(color,-40));
  ctx.fillStyle=bodyGrad;
  ctx.beginPath();
  ctx.moveTo(-34,-55); ctx.lineTo(-38,-20); ctx.lineTo(-32,8);
  ctx.lineTo(32,8); ctx.lineTo(38,-20); ctx.lineTo(34,-55);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#0a0a0f'; ctx.lineWidth=4; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath();
  ctx.moveTo(-28, -50); ctx.lineTo(-32, -20);
  ctx.lineTo(-30, -20); ctx.lineTo(-26, -50);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='#4aa8ff';
  ctx.beginPath();
  ctx.moveTo(-26,-53); ctx.lineTo(-28,-38);
  ctx.lineTo(28,-38); ctx.lineTo(26,-53);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#0a0a0f'; ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.6)';
  ctx.beginPath();
  ctx.moveTo(-20,-51); ctx.lineTo(-22,-40);
  ctx.lineTo(-10,-40); ctx.lineTo(-8,-51);
  ctx.closePath(); ctx.fill();
  if(color2){ ctx.fillStyle = color2; ctx.fillRect(-32, -25, 64, 5); ctx.strokeStyle='#0a0a0f'; ctx.lineWidth=2; ctx.strokeRect(-32, -25, 64, 5); }
  ctx.fillStyle='#ff2d55';
  ctx.beginPath(); ctx.roundRect(-30, -12, 14, 7, 3); ctx.fill();
  ctx.strokeStyle='#0a0a0f'; ctx.lineWidth=2; ctx.stroke();
  ctx.beginPath(); ctx.roundRect(16, -12, 14, 7, 3); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#1a1a1a';
  ctx.beginPath(); ctx.arc(-16, 6, 7, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(16, 6, 7, 0, 7); ctx.fill();
  ctx.strokeStyle='#0a0a0f'; ctx.lineWidth=2.5; ctx.stroke();
  ctx.fillStyle='#000';
  ctx.beginPath(); ctx.arc(-16, 6, 3.5, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(16, 6, 3.5, 0, 7); ctx.fill();
  const bfActive=state.backfire && state.backfire[side]>0 && state.backfire[side]<0.35;
  if((state.running || bfActive) && !stuck){
    const big=bfActive; const fs=big?45:20;
    const flameGrad = ctx.createRadialGradient(0, 18, 0, 0, 18, fs);
    flameGrad.addColorStop(0, '#fff'); flameGrad.addColorStop(0.3, '#ffd60a');
    flameGrad.addColorStop(0.7, '#ff6b1a'); flameGrad.addColorStop(1, 'rgba(255,45,85,0)');
    ctx.fillStyle=flameGrad;
    ctx.beginPath(); ctx.arc(-16, 18, fs*0.5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(16, 18, fs*0.5, 0, 7); ctx.fill();
  }
  if(stuck && state.phase === 'run'){
    ctx.fillStyle = '#ff2d55'; ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2;
    ctx.font = 'bold 14px Impact, sans-serif'; ctx.textAlign = 'center';
    ctx.strokeText('BERAGADT!', 0, -70); ctx.fillText('BERAGADT!', 0, -70);
    ctx.textAlign = 'left';
  }
  ctx.fillStyle='#fff'; ctx.strokeStyle='#0a0a0f'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(0, -30, 11, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#0a0a0f'; ctx.font='bold 12px Impact, sans-serif'; ctx.textAlign='center';
  ctx.fillText(d.car, 0, -26); ctx.textAlign='left';
  ctx.restore();
}

/* ==================================================================
   FELÜLNÉZET (top cam)
   ================================================================== */
function drawTopView(ctx,W,H,pA,pB,state){
  const locId=G.event?G.event.loc.id:'county';
  const tod = G.event?.timeOfDay || 'night';
  const worldLength=402;
  const posA=pA*worldLength, posB=pB*worldLength;
  const leadPos=Math.max(posA,posB);
  let camY=leadPos+30;
  camY=Math.max(camY,40); camY=Math.min(camY,worldLength-10);
  const windowH=140;
  const m2px=H/windowH;
  function worldToScreen(worldY){ return H/2-(worldY-camY)*m2px; }
  const bg=ctx.createLinearGradient(0,0,0,H);
  if(tod==='day'){
    if(locId==='county'){ bg.addColorStop(0,'#4a7a4a'); bg.addColorStop(1,'#3a5a3a'); }
    else { bg.addColorStop(0,'#6a6a78'); bg.addColorStop(1,'#4a4a58'); }
  } else {
    if(locId==='county'){ bg.addColorStop(0,'#0a2a10'); bg.addColorStop(1,'#051a08'); }
    else { bg.addColorStop(0,'#1a1a25'); bg.addColorStop(1,'#0a0a15'); }
  }
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  drawHalftone(ctx, 0, 0, W, H, 8, 'rgba(0,0,0,0.08)');
  const trackLeft=W*0.28, trackRight=W*0.72;
  const trackW=trackRight-trackLeft;
  const halfW=trackW/2-3;
  ctx.fillStyle = tod==='day' ? '#4a4855' : '#2a2a35';
  ctx.fillRect(trackLeft,0,halfW,H);
  ctx.fillRect(trackLeft+halfW+6,0,halfW,H);
  drawHalftone(ctx, trackLeft, 0, trackW, H, 5, 'rgba(0,0,0,0.1)');
  ctx.strokeStyle='#fff'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(trackLeft,0); ctx.lineTo(trackLeft,H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(trackRight,0); ctx.lineTo(trackRight,H); ctx.stroke();
  ctx.strokeStyle='#0a0a0f'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(trackLeft-3,0); ctx.lineTo(trackLeft-3,H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(trackRight+3,0); ctx.lineTo(trackRight+3,H); ctx.stroke();
  ctx.strokeStyle='#ffd60a'; ctx.lineWidth=4; ctx.setLineDash([20,15]);
  ctx.lineDashOffset=-camY*m2px;
  ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke();
  ctx.setLineDash([]); ctx.lineDashOffset=0;
  ctx.font='bold 10px Impact, monospace';
  for(let d=0;d<=worldLength;d+=20){
    const sy=worldToScreen(d);
    if(sy<-10||sy>H+10) continue;
    ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(trackLeft,sy); ctx.lineTo(trackRight,sy); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.7)';
    ctx.fillText(d+'m',trackLeft-35,sy+3);
  }
  const startY=worldToScreen(0);
  if(startY>-20&&startY<H+20){
    const sw=(trackRight-trackLeft)/20;
    for(let i=0;i<20;i++){ ctx.fillStyle=i%2?'#000':'#fff'; ctx.fillRect(trackLeft+i*sw,startY-8,sw+0.5,8); }
  }
  const finishY=worldToScreen(worldLength);
  if(finishY>-20&&finishY<H+20){
    const fw=(trackRight-trackLeft)/20;
    for(let i=0;i<20;i++){ ctx.fillStyle=i%2?'#000':'#fff'; ctx.fillRect(trackLeft+i*fw,finishY-6,fw+0.5,12); }
  }
  drawTopChute(ctx,W,H,pA,state.m.a.d.livery.color,0,state,'a',trackLeft,trackRight,worldToScreen(posA));
  drawTopChute(ctx,W,H,pB,state.m.b.d.livery.color,1,state,'b',trackLeft,trackRight,worldToScreen(posB));
  drawTopCarComic(ctx, trackLeft + halfW*0.5, worldToScreen(posA), state.m.a.d, state, 'a', pA);
  drawTopCarComic(ctx, trackRight - halfW*0.5, worldToScreen(posB), state.m.b.d, state, 'b', pB);
  drawFixedHUD(ctx, W, H, state, pA, pB);
  if(state.phase === 'finish' && state.scoreProgress > 0){
    drawDigitalScoreboard(ctx, W, H, state.m, state.scoreProgress);
  }
}
function drawTopChute(ctx,W,H,p,color,lane,state,side,trackLeft,trackRight,screenY){
  const d=state.m[side].d;
  if(!d.hasChute) return;
  const progress=clamp((p-0.88)/0.12,0,1);
  if(progress<=0) return;
  const trackW=trackRight-trackLeft;
  const x=lane===0?trackLeft+trackW*0.25:trackRight-trackW*0.25;
  const y=screenY;
  const cordLen=30+progress*55;
  const chuteR=4+progress*18;
  const chuteY=y+34+cordLen;
  ctx.strokeStyle='rgba(200,200,200,0.8)'; ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(x-8,y+30); ctx.lineTo(x-chuteR*0.4,chuteY-chuteR*0.5);
  ctx.moveTo(x+8,y+30); ctx.lineTo(x+chuteR*0.4,chuteY-chuteR*0.5);
  ctx.stroke();
  const grad=ctx.createRadialGradient(x,chuteY,0,x,chuteY,chuteR);
  grad.addColorStop(0,shade(color,40)); grad.addColorStop(0.6,color); grad.addColorStop(1,shade(color,-60));
  ctx.fillStyle=grad;
  ctx.beginPath(); ctx.arc(x,chuteY,chuteR,0,7); ctx.fill();
  ctx.strokeStyle='#0a0a0f'; ctx.lineWidth=2; ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=1;
  for(let i=0;i<6;i++){
    const a=(i/6)*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(x,chuteY);
    ctx.lineTo(x+Math.cos(a)*chuteR*0.9,chuteY+Math.sin(a)*chuteR*0.9);
    ctx.stroke();
  }
}
function drawTopCarComic(ctx, x, y, d, state, side, p){

  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, -38); ctx.lineTo(-8, -22); ctx.lineTo(-12, -10);
  ctx.lineTo(-16, 8); ctx.lineTo(-18, 28); ctx.lineTo(18, 28);

  ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 3; ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(0, -36); ctx.lineTo(-6, -22); ctx.lineTo(-8, 22);

  ctx.closePath(); ctx.fill();
  if(color2){ ctx.fillStyle = color2; ctx.fillRect(-3, -30, 6, 50); ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 1.5; ctx.strokeRect(-3, -30, 6, 50); }
  ctx.fillStyle = '#4aa8ff';
  ctx.beginPath(); ctx.ellipse(0, -12, 7, 8, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.fillStyle = '#333'; ctx.fillRect(-22, 30, 44, 8);
  ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 3; ctx.strokeRect(-22, 30, 44, 8);
  if((isRunning || state.burnout) && !stuck){
    const flameLen = 20 + seededRand(Date.now()*0.01)*15;
    ctx.fillStyle = 'rgba(255,200,60,0.8)';
    ctx.beginPath(); ctx.moveTo(-5, 38); ctx.lineTo(0, 38 + flameLen); ctx.lineTo(5, 38); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2; ctx.stroke();
  }
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 5, 10, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#0a0a0f'; ctx.font = 'bold 11px Impact, sans-serif';

  if(stuck && state.phase === 'run'){
    ctx.fillStyle = '#ff2d55'; ctx.font = 'bold 12px Impact, sans-serif'; ctx.textAlign = 'center';

function drawFinishView(ctx,W,H,pA,pB,state){
  const tod = G.event?.timeOfDay || 'night';
  const horizonY=H*0.18;
  const finishY=H-10;
  drawComicSky(ctx, W, H, horizonY, tod);
  ctx.fillStyle = tod==='day' ? '#5a5865' : '#1a1a25';
  ctx.fillRect(0, horizonY, W, H-horizonY);
  const trackCenter=W/2;
  const trackTopW=W*0.06;
  const trackBotW=W*0.98;
  ctx.fillStyle = tod==='day' ? '#4a4855' : '#2a2a35';
  ctx.beginPath();
  ctx.moveTo(trackCenter-trackTopW/2,horizonY);
  ctx.lineTo(trackCenter+trackTopW/2,horizonY);
  ctx.lineTo(trackCenter+trackBotW/2,H);
  ctx.lineTo(trackCenter-trackBotW/2,H);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#0a0a0f'; ctx.lineWidth=3; ctx.stroke();
  ctx.strokeStyle='#fff'; ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(trackCenter-trackTopW/2,horizonY);
  ctx.lineTo(trackCenter-trackBotW/2,H);
  ctx.moveTo(trackCenter+trackTopW/2,horizonY);
  ctx.lineTo(trackCenter+trackBotW/2,H);
  ctx.stroke();

  /* ÚJ: KÖZÉPSŐ SÁV-ELVÁLASZTÓ a célnézetben */
  ctx.strokeStyle='#ffd60a'; ctx.lineWidth=3;
  ctx.setLineDash([16, 14]);
  ctx.beginPath(); ctx.moveTo(trackCenter, horizonY); ctx.lineTo(trackCenter, H); ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle='#0a0a0f'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(trackCenter, horizonY); ctx.lineTo(trackCenter, H); ctx.stroke();

  /* Kockás cél */
  const cw=trackBotW/26;
  for(let i=0;i<26;i++){
    ctx.fillStyle=i%2?'#fff':'#000';
    ctx.fillRect(trackCenter-trackBotW/2+i*cw,finishY-16,cw,10);
    ctx.fillStyle=i%2?'#000':'#fff';
    ctx.fillRect(trackCenter-trackBotW/2+i*cw,finishY-6,cw,10);
  }
  ctx.strokeStyle='#ffd60a'; ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(trackCenter-trackBotW/2,finishY-19);
  ctx.lineTo(trackCenter+trackBotW/2,finishY-19);
  ctx.stroke();
  ctx.strokeStyle='#0a0a0f'; ctx.lineWidth=1.5; ctx.stroke();
  const cars=[
    {side:'a', p:pA, offset:-0.3, color:state.m.a.d.livery.color},
    {side:'b', p:pB, offset:0.3, color:state.m.b.d.livery.color}
  ];
  cars.sort((a,b)=>a.p-b.p);
  cars.forEach(c=>{
    drawFinishCarFrontComic(ctx,W,H,c.p,c.offset,c.side,state,horizonY,finishY,trackTopW,trackBotW,trackCenter,c.color);
  });
  drawFixedHUD(ctx, W, H, state, pA, pB);
  if(state.phase === 'finish' && state.scoreProgress > 0){
    drawDigitalScoreboard(ctx, W, H, state.m, state.scoreProgress);
  }
}
function drawFinishCarFrontComic(ctx,W,H,p,offset,side,state,horizonY,finishY,trackTopW,trackBotW,trackCenter,color){

  ctx.fillStyle='#4aa8ff';
  ctx.beginPath(); ctx.moveTo(-30,-50); ctx.lineTo(-34,-30); ctx.lineTo(34,-30); ctx.lineTo(30,-50); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#0a0a0f'; ctx.lineWidth=3; ctx.stroke();

   FIX HUD

function drawFixedHUD(ctx, W, H, state, pA, pB){
  const dA = state.m.a.d, dB = state.m.b.d;
  const colorA = dA.livery.color, colorB = dB.livery.color;
  const speedA = state.running ? dA.spBase * Math.min(pA, 1) : 0;
  const speedB = state.running ? dB.spBase * Math.min(pB, 1) : 0;
  const panelW = Math.min(240, W * 0.3);
  const panelH = 70;
  const pax = 12, pay = 12;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.roundRect(pax, pay, panelW, panelH, 10); ctx.fill();
  ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 4; ctx.stroke();
  ctx.fillStyle = colorA;
  ctx.beginPath(); ctx.roundRect(pax + 4, pay + 4, panelW - 8, 6, 3); ctx.fill();
  ctx.fillStyle = '#0a0a0f';
  ctx.font = `bold ${Math.max(12, panelW * 0.075)}px Impact, sans-serif`;
  ctx.fillText(dA.name.toUpperCase(), pax + 10, pay + 26);
  ctx.fillStyle = colorA;
  ctx.font = `bold ${Math.max(24, panelW * 0.16)}px Impact, monospace`;
  ctx.textAlign = 'right';
  ctx.fillText(Math.round(speedA), pax + panelW - 50, pay + 58);
  ctx.fillStyle = '#666';
  ctx.font = `bold ${Math.max(11, panelW * 0.055)}px Impact, monospace`;
  ctx.fillText('km/h', pax + panelW - 10, pay + 58);
  ctx.textAlign = 'left';
  const barW = panelW - 20, barH = 8;
  const barX = pax + 10, barY = pay + panelH - 14;
  ctx.fillStyle = '#eee'; ctx.fillRect(barX, barY, barW, barH);
  ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2; ctx.strokeRect(barX, barY, barW, barH);
  const fillW = barW * Math.min(1, speedA / Math.max(200, dA.spBase + 20));
  ctx.fillStyle = colorA; ctx.fillRect(barX + 1, barY + 1, fillW - 2, barH - 2);
  const pbx = W - panelW - 12, pby = 12;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.roundRect(pbx, pby, panelW, panelH, 10); ctx.fill();
  ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 4; ctx.stroke();
  ctx.fillStyle = colorB;
  ctx.beginPath(); ctx.roundRect(pbx + 4, pby + 4, panelW - 8, 6, 3); ctx.fill();
  ctx.fillStyle = '#0a0a0f';
  ctx.font = `bold ${Math.max(12, panelW * 0.075)}px Impact, sans-serif`;
  ctx.fillText(dB.name.toUpperCase(), pbx + 10, pby + 26);
  ctx.fillStyle = colorB;
  ctx.font = `bold ${Math.max(24, panelW * 0.16)}px Impact, monospace`;
  ctx.textAlign = 'right';
  ctx.fillText(Math.round(speedB), pbx + panelW - 50, pby + 58);
  ctx.fillStyle = '#666';
  ctx.font = `bold ${Math.max(11, panelW * 0.055)}px Impact, monospace`;
  ctx.fillText('km/h', pbx + panelW - 10, pby + 58);
  ctx.textAlign = 'left';
  const barBX = pbx + 10, barBY = pby + panelH - 14;
  ctx.fillStyle = '#eee'; ctx.fillRect(barBX, barBY, barW, barH);
  ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2; ctx.strokeRect(barBX, barBY, barW, barH);
  const fillBW = barW * Math.min(1, speedB / Math.max(200, dB.spBase + 20));
  ctx.fillStyle = colorB; ctx.fillRect(barBX + 1, barBY + 1, fillBW - 2, barH - 2);
  const timerW = 150, timerH = 60;
  const tx = (W - timerW) / 2, ty = 12;
  ctx.fillStyle = '#0a0a0f';
  ctx.beginPath(); ctx.roundRect(tx, ty, timerW, timerH, 10); ctx.fill();

function drawBurnoutSmoke(ctx, x, y, color, isDiesel, intensity=1){
  for(let i=0;i<18*intensity;i++){
    const sx = x + (seededRand(i*1.7)-0.5)*70;
    const sy = y - seededRand(i*2.3)*60*intensity - i*3;
    const r = 12 + seededRand(i*3.1)*20;
    const a = 0.9 - i*0.04;
    if(a <= 0) continue;
    ctx.fillStyle = isDiesel ? `rgba(40,40,40,${a})` : `rgba(255,255,255,${a})`;
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, 7); ctx.fill();
    ctx.strokeStyle = `rgba(10,10,15,${a*0.6})`; ctx.lineWidth = 2.5; ctx.stroke();
  }
}
function drawChristmasTree(ctx,x,baseY){
  ctx.fillStyle='#1a1a1a';
  ctx.fillRect(x-3,baseY-100,6,100);
  ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 3; ctx.strokeRect(x-3,baseY-100,6,100);
  ctx.fillStyle='#222'; ctx.fillRect(x-25,baseY-102,50,5); ctx.strokeRect(x-25,baseY-102,50,5);
  const rounds=[
    {y:baseY-28,r:5,color:'#ffd60a',idx:4},
    {y:baseY-46,r:5.5,color:'#00c853',idx:3},
    {y:baseY-64,r:6,color:'#ffd60a',idx:2},
    {y:baseY-80,r:6,color:'#ffd60a',idx:1},
    {y:baseY-96,r:6,color:'#ffd60a',idx:0}
  ];
  const domLights=document.querySelectorAll('#tree .light');
  rounds.forEach(rd=>{
    const on=domLights[rd.idx]?.classList.contains('on');
    if(on){
      const gp=ctx.createRadialGradient(x,rd.y,0,x,rd.y,rd.r*5);
      gp.addColorStop(0,rd.color); gp.addColorStop(0.4,rd.color+'aa'); gp.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=gp; ctx.beginPath(); ctx.arc(x,rd.y,rd.r*5,0,7); ctx.fill();
    }
    ctx.fillStyle=on?rd.color:shade(rd.color,-140);
    ctx.beginPath(); ctx.arc(x,rd.y,rd.r,0,7); ctx.fill();
    ctx.strokeStyle='#0a0a0f'; ctx.lineWidth=3; ctx.stroke();

}
function drawSideChute(ctx,W,H,p,finishX,stopEndX,startX,color,lane,state,side){
  const d=state.m[side].d;
  if(!d.hasChute) return;
  const progress=clamp((p-0.88)/0.12,0,1);
  if(progress<=0) return;
  const trackTop=H*0.55+2, trackBot=H-8;
  const laneH=(trackBot-trackTop)/2;
  const baseY=trackTop+laneH*(lane+0.5)+8;
  const stopPr = (state.phase === 'finish' && state.stopProgress) ? state.stopProgress : 0;
  let x;
  if(p >= 0.999 && stopPr > 0){
    const decel = 1 - Math.pow(1 - clamp(stopPr, 0, 1), 2.5);
    x = finishX + (stopEndX - finishX) * decel;
  } else {
    x = startX + (finishX - startX) * p;
  }
  const chuteX=x-130, chuteY=baseY-20;
  ctx.strokeStyle='rgba(200,200,200,0.85)'; ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(x-65,baseY-8); ctx.lineTo(chuteX+12,chuteY-12);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x-65,baseY+2); ctx.lineTo(chuteX+12,chuteY+12);
  ctx.stroke();
  const chuteR=8+progress*32;
  const cg=ctx.createRadialGradient(chuteX+5,chuteY-5,0,chuteX,chuteY,chuteR);
  cg.addColorStop(0,shade(color,50)); cg.addColorStop(0.5,color); cg.addColorStop(1,shade(color,-70));
  ctx.fillStyle=cg;
  ctx.beginPath(); ctx.ellipse(chuteX,chuteY,chuteR*1.3,chuteR,0,0,7); ctx.fill();
  ctx.strokeStyle='#0a0a0f'; ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(chuteX+chuteR*0.3,chuteY,chuteR*0.85,chuteR*0.7,0,0,7); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=1;
  for(let i=-3;i<=3;i++){
    const a=i*0.35;
    ctx.beginPath(); ctx.moveTo(chuteX,chuteY);
    ctx.lineTo(chuteX+Math.cos(a)*chuteR*1.25,chuteY+Math.sin(a)*chuteR*0.95);
    ctx.stroke();
  }
}

/* ==================================================================
   RACE LOGIC
   ================================================================== */
function runMatch(){
  const f=raceState;
  if(!f||G.animating) return;
  const btn=$('#raceGo'); if(btn) btn.disabled=true;
  const {m,b,cid,ri,mi}=f;
  const ra=runOnce(m.a.d), rb=runOnce(m.b.d);
  let winner, reason;
  if(ra.stuck && !rb.stuck) { winner='b'; reason='A beragadt'; }
  else if(rb.stuck && !ra.stuck) { winner='a'; reason='B beragadt'; }
  else if(ra.red && rb.red){ winner=ra.et<rb.et?'a':'b'; reason='mindkét piros'; }
  else if(ra.red){ winner='b'; reason='piros lámpa (A)'; }
  else if(rb.red){ winner='a'; reason='piros lámpa (B)'; }
  else {
    const ta=ra.rt+ra.et, tb=rb.rt+rb.et;
    winner=ta<tb?'a':'b';
    reason=(Math.abs(ta-tb)<0.002?'fotófinis':(winner==='a'?'A nyert':'B nyert'));
  }
  m.a.run=ra; m.b.run=rb;
  m.winner=winner==='a'?m.a:m.b;
  m.winnerSide=winner;
  m.reason=reason;
  m.aTime=ra.rt+ra.et; m.bTime=rb.rt+rb.et;
  animateRace(ra,rb,m,()=>{
    SFX.forceStopEngine();
    propagateWinner(b,ri,mi,m.winner);
    setTimeout(()=>nextRaceMatch(),1200);
  });
}
function propagateWinner(b,ri,mi,w){
  const nr=b.rounds[ri+1]; if(!nr) return;
  const nm=nr[Math.floor(mi/2)];
  if(mi%2===0) nm.a=w; else nm.b=w;
}
function animateRace(ra,rb,m,done){
  G.animating=true;
  const cv=$('#track');
  if(!cv){ G.animating=false; done(); return; }
  const ctx=cv.getContext('2d');
  const W=cv.width,H=cv.height;
  const lights=document.querySelectorAll('#tree .light');
  const bfEvents=[];
  if(!ra.stuck && Math.random()<0.8) bfEvents.push({side:'a',at:rnd(0.25,0.75)});
  if(!rb.stuck && Math.random()<0.8) bfEvents.push({side:'b',at:rnd(0.25,0.75)});
  bfEvents.sort((a,b)=>a.at-b.at);
  let bfIdx=0;
  let phase='drone', phaseStart=performance.now(), t0=null;
  let finishStartTime=0;
  const state={running:false,m,backfire:{a:0,b:0},autoCam:'side',phase:'drone',
    wheelAngle:0,burnout:false,scoreProgress:0,stopProgress:0,burnoutScreechDone:false,launchScreechDone:false};
  let autoCamNext=0;
  let stuckAnnouncedA = false, stuckAnnouncedB = false;
  const maxET = Math.max(ra.stuck ? 5 : ra.et, rb.stuck ? 5 : rb.et);
  const realDur = Math.min(5.5, maxET + 0.5);
  const timeScale = realDur / maxET;
  SFX.startEngine();
  Commentator.say('drone');
  setTimeout(()=>Commentator.say('burnout'), 1800);
  setTimeout(()=>Commentator.say('stage'), 3000);
  if(m.a.d.fuel === 'diesel' || m.b.d.fuel === 'diesel') setTimeout(()=>Commentator.say('diesel'), 2200);
  const hasChute = m.a.d.hasChute || m.b.d.hasChute;
  function setLight(i,on){ if(lights[i]) lights[i].classList.toggle('on',on); }
  function clearLights(){ lights.forEach(l=>l.classList.remove('on')); }
  function frame(now){
    if(!t0) t0=now;
    const t=(now-t0)/1000;
    const pt=(now-phaseStart)/1000;
    if(G.camMode==='auto'){
      if(t>autoCamNext){
        const cams=['drone','side','crew','top','finish','side'];
        const curIdx=cams.indexOf(state.autoCam);
        state.autoCam=cams[(curIdx+1)%cams.length];
        autoCamNext=t+2.2;
        document.querySelectorAll('.cam-controls button').forEach(bt=>{
          bt.classList.toggle('active', bt.dataset.cam===state.autoCam||bt.dataset.cam==='auto');
        });
      }
    }
    let progressA=0, progressB=0;
    if(phase==='drone'){
      if(pt > 2.5){ phase='burnout'; phaseStart=now; state.phase='burnout'; state.burnout=true; }
    }
    else if(phase==='burnout'){
      state.burnout = true;
      state.wheelAngle = (state.wheelAngle||0) + 0.8;
      if(!state.burnoutScreechDone && pt > 0.15){ SFX.tireScreech(1.8, 0.5); state.burnoutScreechDone = true; }
      if(pt > 2.0){ phase='stage'; state.burnout=false; state.phase='stage'; phaseStart=now; }
    }
    else if(phase==='stage'){ if(pt>0.7){ phase='amber'; phaseStart=now; state.phase='amber'; setLight(0,true); } }
    else if(phase==='amber'){ if(pt>0.35){ setLight(1,true); phase='amber2'; state.phase='amber2'; phaseStart=now; } }
    else if(phase==='amber2'){ if(pt>0.35){ setLight(2,true); phase='green'; state.phase='green'; phaseStart=now; setLight(3,true); Commentator.say('launch'); } }
    else if(phase==='green'){
      if(pt>0.05){
        phase='run'; state.phase='run'; phaseStart=now; state.running=true;
        if(!state.launchScreechDone){ SFX.tireScreech(0.6, 0.75); state.launchScreechDone = true; }
      }
    }
    else if(phase==='run'){
      const el=pt*(1/timeScale);
      const ta=Math.max(0,el-ra.rt), tb=Math.max(0,el-rb.rt);
      if(ra.stuck){
        progressA = 0;
        if(!stuckAnnouncedA){ setTimeout(()=>Commentator.say('stuck'), 100); stuckAnnouncedA=true; }
      } else {
        progressA=clamp(Math.pow(ta/ra.et,0.85),0,1);
      }
      if(rb.stuck){
        progressB = 0;
        if(!stuckAnnouncedB){ setTimeout(()=>Commentator.say('stuck'), 100); stuckAnnouncedB=true; }
      } else {
        progressB=clamp(Math.pow(tb/rb.et,0.85),0,1);
      }
      if(ra.slideOff && progressA > 0.55 && Math.random() < 0.01) Commentator.say('slide');
      if(rb.slideOff && progressB > 0.55 && Math.random() < 0.01) Commentator.say('slide');
      SFX.setRPM(Math.max(progressA,progressB));
      state.wheelAngle=(state.wheelAngle||0)+Math.max(progressA,progressB)*0.5;
      const curP=Math.max(progressA,progressB);
      while(bfIdx<bfEvents.length && curP>=bfEvents[bfIdx].at){
        const e=bfEvents[bfIdx];
        state.backfire[e.side]=0.001;
        SFX.backfire(); Commentator.say('bf');
        bfIdx++;
      }
      state.backfire.a=Math.min(1,state.backfire.a+(1/60)/0.35);
      state.backfire.b=Math.min(1,state.backfire.b+(1/60)/0.35);
      if(curP>0.35&&curP<0.42) Commentator.say('mid');
      if(curP>0.72&&curP<0.78) Commentator.say('mid');
      if(ra.red||rb.red) setLight(4,true);
      // Finish: legalább az egyik autó beér, és mindkettő vagy beért vagy beragadt
      const aDone = progressA >= 0.999 || ra.stuck;
      const bDone = progressB >= 0.999 || rb.stuck;
      if(aDone && bDone){
        phase='finish'; state.phase='finish'; phaseStart=now;
        finishStartTime=now;
        SFX.stopEngine();
        setTimeout(()=>{ SFX.forceStopEngine(); }, 400);
        Commentator.say('finish');
        if(hasChute) setTimeout(()=>Commentator.say('chute'), 350);
        if(ra.red||rb.red) Commentator.say('red');
      }
    } else if(phase==='finish'){
      progressA = ra.stuck ? 0 : 1;
      progressB = rb.stuck ? 0 : 1;
      const elapsed = (now - finishStartTime) / 1000;
      state.scoreProgress = Math.min(1, Math.max(0, (elapsed - 0.7) / 1.3));
      state.stopProgress = clamp((elapsed - 0.3) / 2.2, 0, 1);
    }
    if(phase!=='run' && phase!=='finish'){ progressA=0; progressB=0; }
    ctx.clearRect(0,0,W,H);
    drawScene(ctx,W,H,progressA,progressB,state);
    if(phase==='finish' && (now-finishStartTime)>3600){
      clearLights();
      SFX.forceStopEngine();
      showMatchResult(m);
      G.animating=false;
      done();
      return;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
function showMatchResult(m){
  SFX.forceStopEngine();
  const btnHolder=$('#raceButtons'); if(!btnHolder) return;
  const wName=m.winner.d.name;
  const lName=m.winnerSide==='a'?m.b.d.name:m.a.d.name;
  const wReason = m.reason || '';
  btnHolder.innerHTML=`
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;width:100%;font-weight:900">
      <span style="color:#00c853">🏆 ${esc(wName)}</span>
      <span style="color:#666">vs</span>
      <span style="color:#999">${esc(lName)}</span>
      <span style="color:#ff6b1a;font-family:Impact">${(m.winnerSide==='a'?m.aTime:m.bTime).toFixed(3)}s</span>
      ${wReason?`<span style="color:#8e44ad">· ${esc(wReason)}</span>`:''}
    </div>`;
}
function showBracket(){
  const holder=$('#bracketHolder'); if(!holder) return;

function renderBracket(cid,b){

              <div class="${bw?'w':(m.winner?'l':'')}">${m.b?esc(m.b.d.name):'—'} <span class="t">${m.bTime?m.bTime.toFixed(2):''}</span></div>

        </div>`).join('')}
