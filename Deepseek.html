<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>DRAG RACING TYCOON</title>
<style>
:root{
  --ink:#0a0a0f; --paper:#f4e8c8; --halftone:rgba(10,10,15,0.15);
  --yellow:#ffd60a; --orange:#ff6b1a; --red:#ff2d55;
  --blue:#00b4ff; --green:#00c853; --purple:#8e44ad;
  --gap:6px; --pad:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{background:#1a1a25;color:#0a0a0f;
  font-family:'Comic Sans MS','Segoe UI',system-ui,sans-serif;
  font-weight:700;touch-action:manipulation}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;
  padding:var(--pad);gap:var(--gap);max-width:1500px;margin:0 auto;width:100%;
  overflow:hidden;background:var(--paper);
  background-image:radial-gradient(circle, var(--halftone) 1px, transparent 1px),
    linear-gradient(180deg, #f4e8c8 0%, #e8d8a8 100%);
  background-size: 8px 8px, 100% 100%}
#splash{position:fixed;inset:0;z-index:1000;background:#0a0a0f;display:flex;
  align-items:center;justify-content:center;overflow:hidden}
#splash.hidden{display:none;animation:slideOut .8s ease forwards}
@keyframes slideOut{to{opacity:0;transform:scale(1.08)}}
#splashCanvas{position:absolute;inset:0;width:100%;height:100%}
.splash-content{position:relative;z-index:2;text-align:center;padding:20px;
  animation:splashIn 1s cubic-bezier(.34,1.56,.64,1)}
@keyframes splashIn{from{opacity:0;transform:translateY(40px) scale(.9)}to{opacity:1;transform:none}}
.splash-title{font-size:clamp(48px,10vw,130px);font-weight:900;letter-spacing:4px;
  font-family:'Impact','Arial Black',sans-serif;color:var(--yellow);
  -webkit-text-stroke:4px #0a0a0f;
  text-shadow:6px 6px 0 #0a0a0f,-3px -3px 0 #ff2d55,8px 8px 0 rgba(0,0,0,.3);
  line-height:.9;transform:rotate(-3deg);
  animation:titleWiggle 3s ease-in-out infinite}
@keyframes titleWiggle{0%,100%{transform:rotate(-3deg) scale(1)}
  50%{transform:rotate(-3deg) scale(1.05)}}
.splash-subtitle{font-size:clamp(20px,4vw,52px);font-weight:900;letter-spacing:8px;
  font-family:'Impact','Arial Black',sans-serif;color:#fff;
  -webkit-text-stroke:3px #0a0a0f;text-shadow:4px 4px 0 #ff6b1a;
  margin-top:-10px;margin-bottom:30px;transform:rotate(-3deg)}
.splash-tagline{font-size:clamp(12px,1.8vw,18px);color:#0a0a0f;background:var(--yellow);
  display:inline-block;padding:8px 20px;border:3px solid #0a0a0f;
  border-radius:30px;letter-spacing:2px;text-transform:uppercase;
  margin-bottom:36px;box-shadow:4px 4px 0 #0a0a0f;transform:rotate(1deg)}
.splash-start{font-size:clamp(20px,3vw,30px);padding:20px 70px;font-weight:900;
  letter-spacing:3px;font-family:'Impact','Arial Black',sans-serif;
  background:var(--red);color:#fff;-webkit-text-stroke:2px #0a0a0f;
  border:4px solid #0a0a0f;border-radius:8px;cursor:pointer;
  box-shadow:8px 8px 0 #0a0a0f;transition:.1s;position:relative;text-transform:uppercase}
.splash-start:hover{transform:translate(-2px,-2px);box-shadow:10px 10px 0 #0a0a0f}
.splash-start:active{transform:translate(4px,4px);box-shadow:4px 4px 0 #0a0a0f}
.splash-info{margin-top:32px;color:#fff;font-size:13px;letter-spacing:1.5px;
  background:rgba(0,0,0,.7);padding:10px 20px;border-radius:30px;
  border:2px solid #fff;display:inline-block}
.splash-info b{color:var(--yellow)}
.splash-credits{position:absolute;bottom:20px;left:0;right:0;text-align:center;
  color:#666;font-size:11px;letter-spacing:2px;z-index:2;font-family:monospace}
header{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;
  gap:8px;flex-wrap:wrap;padding:8px 14px;background:var(--yellow);
  border:4px solid #0a0a0f;border-radius:10px;box-shadow:5px 5px 0 #0a0a0f;
  position:relative;overflow:hidden}
header::before{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(45deg,transparent 0 10px,rgba(0,0,0,.06) 10px 12px);
  pointer-events:none}
.logo{font-family:'Impact','Arial Black',sans-serif;
  font-size:clamp(14px,1.8vw,22px);font-weight:900;letter-spacing:1px;
  color:#fff;-webkit-text-stroke:2px #0a0a0f;
  text-shadow:3px 3px 0 var(--red);text-transform:uppercase;
  position:relative;z-index:1}
.stats{display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:relative;z-index:1}
.stat{background:#fff;border:3px solid #0a0a0f;border-radius:8px;
  padding:5px 12px;font-size:14px;font-weight:900;
  display:flex;align-items:center;gap:6px;
  box-shadow:3px 3px 0 #0a0a0f;color:#0a0a0f}
.stat .icon{font-size:20px;line-height:1}
.stat b{font-size:16px;color:#0a0a0f;font-family:'Impact',sans-serif}
.stat.rep{background:#d8b8f0}
.stat.week{background:#b8e0ff}
.music-bar{display:flex;gap:6px;align-items:center;background:#fff;
  border:3px solid #0a0a0f;border-radius:8px;padding:4px 8px;
  box-shadow:3px 3px 0 #0a0a0f}
.music-bar .eq{display:flex;gap:2px;height:16px;align-items:flex-end}
.music-bar .eq span{width:3px;background:var(--red);border-radius:1px;height:4px;border:1px solid #0a0a0f}
.music-bar.playing .eq span{animation:eq 0.6s ease-in-out infinite}
.music-bar.playing .eq span:nth-child(1){animation-delay:0s}
.music-bar.playing .eq span:nth-child(2){animation-delay:.15s}
.music-bar.playing .eq span:nth-child(3){animation-delay:.3s}
.music-bar.playing .eq span:nth-child(4){animation-delay:.45s}
@keyframes eq{0%,100%{height:4px}50%{height:16px}}
.music-bar select{background:#fff;color:#0a0a0f;border:2px solid #0a0a0f;
  border-radius:4px;padding:2px 6px;font-size:11px;font-family:inherit;font-weight:900;cursor:pointer}
.music-bar input[type=range]{width:50px;height:6px;accent-color:var(--red)}
.card{background:#fff;border:4px solid #0a0a0f;border-radius:12px;
  padding:12px 16px;box-shadow:5px 5px 0 #0a0a0f;margin:0;
  position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:-50%;right:-50%;width:200%;height:200%;
  background:radial-gradient(circle, rgba(255,107,26,.06) 1px, transparent 1px);
  background-size:6px 6px;pointer-events:none}
.card h2{font-family:'Impact','Arial Black',sans-serif;font-size:16px;
  margin-bottom:6px;letter-spacing:.5px;color:#0a0a0f;text-transform:uppercase;
  position:relative;z-index:1;display:flex;align-items:center;gap:8px}
.card h2 .num{display:inline-flex;align-items:center;justify-content:center;
  background:var(--red);color:#fff;width:28px;height:28px;border-radius:50%;
  border:3px solid #0a0a0f;font-size:14px;font-weight:900;
  box-shadow:2px 2px 0 #0a0a0f}
.sub{color:#666;font-size:12px;margin-bottom:10px;font-weight:600;position:relative;z-index:1}
button{font-family:'Impact','Arial Black',sans-serif;cursor:pointer;
  border:3px solid #0a0a0f;border-radius:8px;padding:9px 18px;
  font-size:13px;font-weight:900;letter-spacing:.5px;transition:.1s;
  background:#fff;color:#0a0a0f;box-shadow:4px 4px 0 #0a0a0f;
  text-transform:uppercase;touch-action:manipulation;position:relative}
button:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:5px 5px 0 #0a0a0f}
button:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 #0a0a0f}
button:disabled{opacity:.4;cursor:not-allowed;box-shadow:2px 2px 0 #0a0a0f;transform:translate(2px,2px)}
button.primary{background:var(--orange);color:#fff;-webkit-text-stroke:.5px #0a0a0f}
button.danger{background:var(--red);color:#fff}
button.success{background:var(--green);color:#fff}
button.ghost{background:#fff;color:#0a0a0f;border-style:dashed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.pick{background:#fff;border:3px solid #0a0a0f;border-radius:10px;
  padding:12px;cursor:pointer;transition:.1s;position:relative;overflow:hidden;
  box-shadow:4px 4px 0 #0a0a0f}
.pick:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #0a0a0f}
.pick.sel{background:var(--yellow);
  box-shadow:4px 4px 0 #0a0a0f, 0 0 0 3px var(--red) inset}
.pick.sel::after{content:'✓';position:absolute;top:8px;right:8px;
  width:26px;height:26px;background:var(--green);color:#fff;
  border:3px solid #0a0a0f;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:16px;box-shadow:2px 2px 0 #0a0a0f}
.pick.locked{opacity:.5;cursor:not-allowed;filter:grayscale(.7)}
.pick .t{font-family:'Impact',sans-serif;font-weight:900;font-size:15px;
  margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.pick .d{font-size:11px;color:#444;line-height:1.5;font-weight:600}
.pick .tag{position:absolute;top:8px;right:8px;font-size:10px;padding:3px 8px;
  border-radius:20px;background:#0a0a0f;color:#fff;font-weight:900;letter-spacing:.5px}
.pick.sel .tag{background:var(--red)}
.pick .price{color:var(--green);font-weight:900;font-size:13px;margin-top:8px;
  text-shadow:0 0 3px rgba(0,200,83,.4)}
.loc-preview{width:100%;height:110px;border-radius:6px;margin-bottom:8px;
  border:3px solid #0a0a0f;display:block;box-shadow:3px 3px 0 #0a0a0f}
.slider-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;
  padding:8px 12px;background:#fff;border:3px solid #0a0a0f;
  border-radius:12px;box-shadow:4px 4px 0 #0a0a0f;position:relative}
.slider-row:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 #0a0a0f}
.slider-icon{flex:0 0 46px;width:46px;height:46px;border-radius:50%;
  background:var(--yellow);border:3px solid #0a0a0f;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;line-height:1;box-shadow:3px 3px 0 #0a0a0f;transition:.1s}
.slider-main{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.slider-label{font-family:'Impact',sans-serif;font-size:12px;font-weight:900;
  text-transform:uppercase;letter-spacing:.5px;color:#0a0a0f;
  display:flex;align-items:center;gap:6px}
.slider-label .sub{font-family:'Segoe UI',sans-serif;font-size:10px;color:#888;
  text-transform:none;letter-spacing:0;font-weight:600;margin:0}
.slider-row input[type=range]{width:100%;-webkit-appearance:none;height:14px;
  border-radius:10px;background:#fff;border:3px solid #0a0a0f;outline:none;
  box-shadow:inset 3px 3px 0 rgba(0,0,0,.12);cursor:pointer}
.slider-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;
  width:26px;height:26px;border-radius:50%;background:var(--red);
  border:3px solid #0a0a0f;cursor:pointer;box-shadow:2px 2px 0 #0a0a0f;transition:.1s}
.slider-row input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.08)}
.slider-row input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;
  background:var(--red);border:3px solid #0a0a0f;cursor:pointer;box-shadow:2px 2px 0 #0a0a0f}
.slider-row .val{flex:0 0 auto;min-width:68px;text-align:right;
  font-family:'Impact',monospace;font-weight:900;font-size:13px;
  color:#0a0a0f;background:var(--yellow);border:3px solid #0a0a0f;border-radius:8px;
  padding:4px 7px;box-shadow:3px 3px 0 #0a0a0f;white-space:nowrap}
.slider-hint{font-size:10px;color:#888;margin:-6px 0 10px 78px;
  font-weight:600;font-style:italic}
.summary-row{display:flex;justify-content:space-between;padding:6px 0;
  border-bottom:2px dashed #0a0a0f;font-size:12px;font-weight:700}
.summary-row span:first-child{display:flex;align-items:center;gap:6px}
.summary-row span:first-child .icon{font-size:16px}
.summary-row span:last-child{font-weight:900}
.pos{color:var(--green);font-weight:900}
.neg{color:var(--red);font-weight:900}
.hr{height:3px;background:#0a0a0f;margin:10px 0;border-radius:2px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;
  font-size:11px;font-weight:900;background:#ddd;color:#0a0a0f;
  margin-right:4px;border:2px solid #0a0a0f;text-transform:uppercase;letter-spacing:.5px}
.badge.on{background:var(--green);color:#fff}
.warn{background:#ffeb99;border:3px solid #0a0a0f;border-radius:8px;
  padding:8px 12px;font-size:12px;color:#0a0a0f;margin-bottom:8px;
  box-shadow:3px 3px 0 #0a0a0f;font-weight:800;display:flex;align-items:center;gap:8px}
.setup-header-card{flex-shrink:0}
#setupBody{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;
  -webkit-overflow-scrolling:touch;display:flex;flex-direction:column;
  gap:var(--gap);padding-right:6px;padding-bottom:4px}
#setupBody > .card{flex-shrink:0}
#setupBody::-webkit-scrollbar{width:10px}
#setupBody::-webkit-scrollbar-track{background:#e8d8a8;border-radius:8px}
#setupBody::-webkit-scrollbar-thumb{background:var(--red);border-radius:8px;border:2px solid #0a0a0f}
.setup-actions-card{flex-shrink:0}
.scroll-content{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;
  -webkit-overflow-scrolling:touch;display:flex;flex-direction:column;
  gap:var(--gap);padding-right:4px}
.scroll-content > .card{flex-shrink:0}
.scroll-content::-webkit-scrollbar{width:10px}
.scroll-content::-webkit-scrollbar-thumb{background:var(--red);border-radius:8px;border:2px solid #0a0a0f}
#raceStage{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.race-topbar{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;
  gap:8px;flex-wrap:wrap;padding:6px 12px;background:var(--yellow);
  border:3px solid #0a0a0f;border-radius:8px;box-shadow:4px 4px 0 #0a0a0f;font-size:12px}
.race-title{font-family:'Impact',sans-serif;font-weight:900;font-size:13px;
  text-transform:uppercase;letter-spacing:.5px}
.race-info-chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{background:#fff;border:2px solid #0a0a0f;border-radius:20px;
  padding:3px 10px;font-size:10px;font-weight:900;box-shadow:2px 2px 0 #0a0a0f}
.chip.day{background:var(--yellow)}
.chip.night{background:var(--purple);color:#fff}
.cam-controls{display:flex;gap:4px;flex-wrap:wrap}
.cam-controls button{padding:5px 10px;font-size:11px;background:#fff;
  color:#0a0a0f;box-shadow:3px 3px 0 #0a0a0f}
.cam-controls button.active{background:var(--red);color:#fff}
#trackWrap{flex:1;min-height:100px;position:relative;background:#0a0a0f;
  border:4px solid #0a0a0f;border-radius:10px;overflow:hidden;
  box-shadow:5px 5px 0 #0a0a0f, inset 0 0 30px rgba(0,0,0,.5)}
canvas.track{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  max-width:100%;max-height:100%;width:auto;height:auto;display:block}
.race-bottom{flex-shrink:0;display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}
.lights{display:flex;gap:4px;justify-content:center;align-items:center;
  padding:6px 10px;background:#0a0a0f;border-radius:8px;border:3px solid #0a0a0f;
  box-shadow:inset 0 0 15px rgba(0,0,0,.8)}
.light{width:18px;height:18px;border-radius:50%;background:#1a1a26;
  border:2px solid #333;transition:.1s}
.light.on{box-shadow:0 0 15px currentColor, inset 0 0 8px rgba(255,255,255,.6);background:currentColor}
.race-players{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex-shrink:0}
.race-players .pick{padding:8px 12px;cursor:default;box-shadow:3px 3px 0 #0a0a0f}
.race-players .pick .t{font-size:13px;margin-bottom:3px}
.race-players .pick .d{font-size:10px;font-weight:700}
.race-buttons{display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0}
.commentary{background:#fff;border:3px solid #0a0a0f;border-radius:8px;
  padding:8px 12px;font-size:11px;max-height:64px;overflow-y:auto;flex-shrink:0;
  display:flex;flex-direction:column;gap:2px;
  -webkit-overflow-scrolling:touch;box-shadow:3px 3px 0 #0a0a0f;position:relative}
.commentary::before{content:'🎙️';position:absolute;top:-12px;left:10px;
  background:var(--red);color:#fff;padding:2px 8px;
  border:2px solid #0a0a0f;border-radius:20px;font-size:11px;font-weight:900}
.commentary .cline{color:#333;animation:fade .4s;font-size:10px;font-weight:700}
.commentary .cline:first-child{color:var(--red);font-weight:900;font-size:11px}
.bracket{display:flex;gap:14px;overflow-x:auto;padding:8px 0}
.bround{display:flex;flex-direction:column;justify-content:space-around;gap:6px;min-width:150px}
.bmatch{background:#fff;border:3px solid #0a0a0f;border-radius:8px;
  padding:5px 10px;font-size:11px;font-weight:700;box-shadow:2px 2px 0 #0a0a0f}
.bmatch .w{color:var(--green);font-weight:900}
.bmatch .l{color:#999;text-decoration:line-through}
.bmatch .t{float:right;color:#666;font-size:10px;font-family:monospace}
table{width:100%;border-collapse:collapse;font-size:11px;background:#fff;
  border:3px solid #0a0a0f;border-radius:8px;overflow:hidden}
th{text-align:left;padding:6px 8px;background:#0a0a0f;color:var(--yellow);
  font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:900}
td{padding:5px 8px;border-bottom:1px solid #ddd;font-weight:700}
tr:hover td{background:#ffe}
.pos1{color:var(--yellow);font-weight:900;text-shadow:1px 1px 0 #0a0a0f}
.pos2{color:#999;font-weight:900}
.pos3{color:#cd7f32;font-weight:900}
.fade{animation:fade .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes fade{from{opacity:0;transform:translateY(15px) scale(.95)}to{opacity:1;transform:none}}
.slide-in{animation:slideIn .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes slideIn{from{opacity:0;transform:translateX(-40px) rotate(-2deg)}to{opacity:1;transform:none}}
.hero-banner{position:relative;height:130px;margin-bottom:10px;
  border:4px solid #0a0a0f;border-radius:10px;overflow:hidden;
  box-shadow:5px 5px 0 #0a0a0f;background:#1a1a25}
.hero-banner canvas{display:block;width:100%;height:100%}
.hero-overlay{position:absolute;inset:0;display:flex;flex-direction:column;
  justify-content:center;align-items:flex-start;padding:0 24px;
  background:linear-gradient(90deg, rgba(0,0,0,.8) 0%, rgba(0,0,0,.3) 60%, transparent 100%);
  pointer-events:none}
.hero-overlay h1{font-family:'Impact',sans-serif;font-size:clamp(24px,4vw,46px);
  color:var(--yellow);-webkit-text-stroke:3px #0a0a0f;
  text-shadow:4px 4px 0 var(--red);letter-spacing:2px;line-height:1;
  text-transform:uppercase;transform:rotate(-2deg)}
.hero-overlay p{color:#fff;font-size:12px;letter-spacing:2px;text-transform:uppercase;
  margin-top:6px;text-shadow:2px 2px 0 #0a0a0f;font-weight:900}
@media (max-height: 750px){
  :root{--gap:5px;--pad:6px}
  .card{padding:10px 12px}
  header{padding:6px 10px}
  button{padding:7px 14px;font-size:11px}
  .hero-banner{height:100px}
  .slider-icon{flex:0 0 42px;width:42px;height:42px;font-size:22px}
  .slider-row{padding:6px 10px;gap:8px;margin-bottom:6px}
}
@media (max-height: 550px){
  :root{--gap:4px;--pad:4px}
  .card{padding:8px 10px;border-radius:8px;border-width:3px}
  header{padding:4px 8px;border-width:3px}
  .logo{display:none}
  .card h2{font-size:13px}
  .card h2 .num{width:22px;height:22px;font-size:11px}
  button{padding:5px 10px;font-size:10px;border-width:2px;box-shadow:3px 3px 0 #0a0a0f}
  .pick{padding:8px;border-width:2px}
  .pick .t{font-size:12px}
  .pick .d{font-size:10px}
  .hero-banner{height:80px}
  .slider-row{padding:5px 8px;gap:7px;margin-bottom:5px}
  .slider-icon{flex:0 0 38px;width:38px;height:38px;font-size:20px}
  .slider-label{font-size:11px}
  .slider-row .val{font-size:11px;min-width:60px;padding:3px 6px}

const Music = {
  ctx:null,master:null,isPlaying:false,cur:'none',step:0,nextT:0,timer:null,
  init(){ if(this.ctx) return true;
    try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.3;
      this.master.connect(this.ctx.destination); return true;

  },
  setVol(v){ if(this.master) this.master.gain.value = v; },
  play(id){ if(!this.init()) return;
    const start = ()=>{
      this.stop(); if(id==='none'){ this.cur='none'; return; }
      this.cur=id; this.isPlaying=true; this.step=0;
      this.nextT=this.ctx.currentTime+0.1;
      this.timer=setInterval(()=>this.tick(),25);
    };
    if(this.ctx.state==='suspended'){ this.ctx.resume().then(start); }
    else start();
  },
  stop(){ if(this.timer) clearInterval(this.timer); this.timer=null; this.isPlaying=false; },
  tick(){ if(!this.isPlaying||!this.ctx) return;
    const spb = 60/STATIONS[this.cur].bpm/4;
    while(this.nextT < this.ctx.currentTime+0.15){
      this.step16(this.step, this.nextT); this.nextT+=spb; this.step=(this.step+1)%16;
    }
  },
  step16(s,t){ const st=STATIONS[this.cur];
    if(st.kick[s]) this.kick(t); if(st.snare[s]) this.snare(t);
    if(st.hat[s]) this.hat(t);
    if(st.bass[s]&&s%2===0) this.bass(t,st.bass[s],st.bw);
    if(st.lead[s]) this.lead(t,st.lead[s],st.lw);

  kick(t){ const o=this.ctx.createOscillator(),g=this.ctx.createGain();

    o.connect(g).connect(this.master); o.start(t); o.stop(t+0.25);
  },
  snare(t){ const buf=this.ctx.createBuffer(1,2048,this.ctx.sampleRate);
    const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const s=this.ctx.createBufferSource(); s.buffer=buf;
    const g=this.ctx.createGain(); g.gain.setValueAtTime(0.3,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
    const f=this.ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=1500;
    s.connect(f).connect(g).connect(this.master); s.start(t); s.stop(t+0.2);
  },
  hat(t){ const buf=this.ctx.createBuffer(1,1024,this.ctx.sampleRate);
    const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const s=this.ctx.createBufferSource(); s.buffer=buf;

    const f=this.ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=6000;
    s.connect(f).connect(g).connect(this.master); s.start(t); s.stop(t+0.08);
  },
  bass(t,freq,wave){ const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=wave||'square'; o.frequency.value=freq;
    g.gain.setValueAtTime(0.18,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
    o.connect(g).connect(this.master); o.start(t); o.stop(t+0.2);
  },
  lead(t,freq,wave){ const o=this.ctx.createOscillator(),g=this.ctx.createGain();

    g.gain.setValueAtTime(0.08,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
    o.connect(g).connect(this.master); o.start(t); o.stop(t+0.25);

    const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<bufLen;i++){ const env = Math.pow(1 - i/bufLen, 1.2); d[i] = (Math.random()*2-1) * env; }
    const s = ctx.createBufferSource(); s.buffer = buf;
    const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = 800; bp.Q.value = 1.2;
    const sg = ctx.createGain(); sg.gain.value = 2.2;
    s.connect(bp).connect(sg).connect(ctx.destination);
    s.start(now); s.stop(now+0.45);
    const o2 = ctx.createOscillator(); const og2 = ctx.createGain();
    o2.type='square'; o2.frequency.setValueAtTime(500, now);
    o2.frequency.exponentialRampToValueAtTime(70, now+0.09);
    og2.gain.setValueAtTime(0.8, now);
    og2.gain.exponentialRampToValueAtTime(0.001, now+0.12);
    o2.connect(og2).connect(ctx.destination);
    o2.start(now); o2.stop(now+0.14);
    const o3 = ctx.createOscillator(); const og3 = ctx.createGain();
    o3.type='sine'; o3.frequency.setValueAtTime(55, now);
    o3.frequency.exponentialRampToValueAtTime(25, now+0.22);
    og3.gain.setValueAtTime(1.0, now);
    og3.gain.exponentialRampToValueAtTime(0.001, now+0.3);
    o3.connect(og3).connect(ctx.destination);
    o3.start(now); o3.stop(now+0.32);
  }
};

const ri = (a,b)=>Math.floor(rnd(a,b+1));
const pick = a=>a[ri(0,a.length-1)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt = n=>Math.round(n).toLocaleString('hu-HU');
const money = n => { const sign = n < 0 ? '-' : ''; return sign + '€' + fmt(Math.abs(n)); };
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function shade(hex, amt){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)+amt, g=((n>>8)&0xff)+amt, b=(n&0xff)+amt;
  r=clamp(r,0,255); g=clamp(g,0,255); b=clamp(b,0,255);
  return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}
function drawHalftone(ctx, x, y, w, h, size = 4, color = 'rgba(0,0,0,0.15)'){
  ctx.save(); ctx.fillStyle = color;
  for(let py = y; py < y + h; py += size){
    for(let px = x; px < x + w; px += size){
      ctx.beginPath(); ctx.arc(px + size/2, py + size/2, size * 0.22, 0, 7); ctx.fill();
    }
  }
  ctx.restore();
}

let splashAnimId=null, splashStartTime=0;
function startSplashAnimation(){
  const cv=$('#splashCanvas'); if(!cv) return;
  function resize(){ cv.width=cv.clientWidth; cv.height=cv.clientHeight; }
  resize(); window.addEventListener('resize', resize);
  splashStartTime = performance.now();
  function loop(now){ if(!document.getElementById('splashCanvas')) return;
    drawSplash(cv, now - splashStartTime);
    splashAnimId = requestAnimationFrame(loop);
  }
  splashAnimId = requestAnimationFrame(loop);
}
function stopSplashAnimation(){ if(splashAnimId) cancelAnimationFrame(splashAnimId); splashAnimId=null; }

function drawSplash(cv, t){
  const ctx=cv.getContext('2d');
  const W=cv.width, H=cv.height, tSec=t/1000;
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#1a0530'); sky.addColorStop(0.15,'#3a0a3a');
  sky.addColorStop(0.32,'#8a1a3a'); sky.addColorStop(0.5,'#d93a35');
  sky.addColorStop(0.7,'#ff8a30'); sky.addColorStop(0.88,'#ffd60a'); sky.addColorStop(1,'#ffe680');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
  for(let i=0;i<80;i++){
    const sx = (i*173.3+7)%W, sy = (i*71.7+3)%(H*0.35);
    const tw = 0.4 + 0.6*Math.abs(Math.sin(tSec*1.5 + i));
    ctx.fillStyle = `rgba(255,255,255,${tw})`;
    ctx.beginPath(); ctx.arc(sx, sy, 1.5, 0, 7); ctx.fill();
  }
  const sunX = W * 0.5, sunY = H * 0.58, sunR = Math.min(W, H) * 0.19;
  for(let i=0;i<24;i++){
    const a = (i/24) * Math.PI * 2 + tSec * 0.15;
    const r1 = sunR + 6;
    const r2 = sunR + 48 + Math.sin(tSec * 2 + i) * 14;
    ctx.strokeStyle = i%2 ? '#ffd60a' : '#ff8a30'; ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(sunX + Math.cos(a)*r1, sunY + Math.sin(a)*r1);
    ctx.lineTo(sunX + Math.cos(a)*r2, sunY + Math.sin(a)*r2);
    ctx.stroke();
    ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2.5; ctx.stroke();
  }
  const sunGrad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR);
  sunGrad.addColorStop(0, '#fffce0'); sunGrad.addColorStop(0.5, '#ffeb99'); sunGrad.addColorStop(1, '#ffd60a');
  ctx.fillStyle = sunGrad;
  ctx.beginPath(); ctx.arc(sunX, sunY, sunR, 0, 7); ctx.fill();
  ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 6; ctx.stroke();
  ctx.fillStyle = '#0a0a0f';
  ctx.beginPath(); ctx.arc(sunX - sunR*0.32, sunY - sunR*0.18, sunR*0.09, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(sunX + sunR*0.32, sunY - sunR*0.18, sunR*0.09, 0, 7); ctx.fill();
  ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(sunX, sunY + sunR*0.05, sunR*0.42, 0.15*Math.PI, 0.85*Math.PI); ctx.stroke();
  drawHalftone(ctx, 0, 0, W, H*0.6, 14, 'rgba(255,255,255,0.05)');
  const trackTop = H * 0.72;
  const buildings = getSplashBuildings(W, H);
  const now = Date.now();
  const bColors = ['#2a0a3a','#3a1050','#4a1a3a','#1a1a40','#2a1a50','#3a0a2a','#252050'];
  buildings.forEach((b, i) => {
    ctx.fillStyle = bColors[i % bColors.length];
    ctx.fillRect(b.x, trackTop - b.h, b.w, b.h);
    ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 4;
    ctx.strokeRect(b.x, trackTop - b.h, b.w, b.h);
    b.windows.forEach(w => {
      const twinkle = 0.55 + 0.45 * Math.abs(Math.sin(now * 0.0012 + w.seed * 0.1));
      ctx.fillStyle = `rgba(255, 214, 10, ${twinkle})`;
      ctx.fillRect(w.x, w.y, 5, 7);
      ctx.strokeStyle = 'rgba(10,10,15,0.8)'; ctx.lineWidth = 1.2;
      ctx.strokeRect(w.x, w.y, 5, 7);
    });
    if(b.antennaType === 1){
      ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(b.x + b.w/2, trackTop - b.h); ctx.lineTo(b.x + b.w/2, trackTop - b.h - 18); ctx.stroke();
      const blink = Math.sin(now * 0.004 + i) > 0 ? 1 : 0.2;
      ctx.fillStyle = `rgba(255, 50, 50, ${blink})`;
      ctx.beginPath(); ctx.arc(b.x + b.w/2, trackTop - b.h - 20, 3.5, 0, 7); ctx.fill();
      ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 1.5; ctx.stroke();
    }
  });
  for(let i = 0; i < 40; i++){
    const cx = (i * 137 + 20) % W, cy = trackTop - 4;
    ctx.fillStyle = i%2 ? '#1a0a20' : '#2a1030';
    ctx.beginPath(); ctx.arc(cx, cy - 6, 3.5, 0, 7); ctx.fill();
    ctx.fillRect(cx - 3, cy - 3, 6, 8);
  }
  ctx.fillStyle = '#2a2835'; ctx.fillRect(0, trackTop, W, H - trackTop);
  ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(0, trackTop); ctx.lineTo(W, trackTop); ctx.stroke();
  ctx.strokeStyle = '#ffd60a'; ctx.lineWidth = 7; ctx.setLineDash([60, 45]);
  ctx.beginPath(); ctx.moveTo(0, (trackTop + H)/2); ctx.lineTo(W, (trackTop + H)/2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, (trackTop + H)/2); ctx.lineTo(W, (trackTop + H)/2); ctx.stroke();
  const colors = ['#ff2d55','#00b4ff','#ffd60a','#00c853','#8e44ad','#ff6b1a','#ffffff'];
  for(let i=0;i<50;i++){
    const cxp = (i*61 + 30) % W, cyp = trackTop + 2 + (i%3) * 3;
    const bob = Math.sin(tSec*2 + i)*1.5;
    ctx.fillStyle = colors[i % colors.length];
    ctx.beginPath(); ctx.arc(cxp, cyp - 5 + bob, 3.5, 0, 7); ctx.fill();
    ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#ffd9b8';
    ctx.beginPath(); ctx.arc(cxp, cyp - 11 + bob, 3, 0, 7); ctx.fill();
    ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 1; ctx.stroke();
  }
  const cycle = (tSec * 0.28) % 4;
  if(cycle < 2.2){ const p = cycle/2.2; drawSplashCar(ctx, -220 + (W+440)*p, trackTop + (H-trackTop)*0.3, 1.4, '#ff2d55', '#ffd60a', p, tSec); }
  if(cycle > 1.8 && cycle < 4){ const p = (cycle-1.8)/2.2; drawSplashCar(ctx, -220 + (W+440)*p, trackTop + (H-trackTop)*0.72, 1.7, '#00b4ff', '#ffffff', p, tSec+0.7); }
  const vig=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.85);
  vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=vig; ctx.fillRect(0,0,W,H);
}

function drawSplashCar(ctx, x, y, scale, color, color2, p, t){
  ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
  if(p < 0.15){
    const a = (1 - p/0.15) * 0.7;

  }
  ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(2, 18, 72, 8, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#0a0a0f'; ctx.beginPath(); ctx.arc(-48, 2, 22, 0, 7); ctx.fill();
  ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#1a1a1a'; ctx.beginPath(); ctx.arc(-48, 2, 14, 0, 7); ctx.fill();
  ctx.fillStyle = '#888'; ctx.beginPath(); ctx.arc(-48, 2, 6, 0, 7); ctx.fill();
  ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-48, 2, 2, 0, 7); ctx.fill();
  ctx.fillStyle = '#0a0a0f'; ctx.beginPath(); ctx.arc(70, 12, 8, 0, 7); ctx.fill();
  ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#666'; ctx.beginPath(); ctx.arc(70, 12, 3, 0, 7); ctx.fill();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(86, 6); ctx.lineTo(84, -2);
  ctx.bezierCurveTo(80, -6, 70, -10, 58, -12); ctx.lineTo(30, -14);
  ctx.bezierCurveTo(22, -15, 18, -20, 14, -26);
  ctx.lineTo(4, -30); ctx.lineTo(-10, -28);
  ctx.bezierCurveTo(-22, -27, -30, -24, -42, -22);
  ctx.lineTo(-62, -22); ctx.lineTo(-66, -12); ctx.lineTo(-62, 8); ctx.lineTo(48, 10);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = shade(color, 60);
  ctx.beginPath(); ctx.moveTo(70, -6); ctx.lineTo(20, -20); ctx.lineTo(20, -16); ctx.lineTo(70, -2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = shade(color, -50);
  ctx.beginPath(); ctx.moveTo(-62, 4); ctx.lineTo(48, 6); ctx.lineTo(48, 10); ctx.lineTo(-62, 8); ctx.closePath(); ctx.fill();
  if(color2){ ctx.fillStyle = color2; ctx.fillRect(-58, -3, 100, 4); ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2; ctx.strokeRect(-58, -3, 100, 4); }
  ctx.fillStyle = '#4aa8ff';
  ctx.beginPath(); ctx.moveTo(14, -26); ctx.lineTo(4, -30); ctx.lineTo(-6, -27); ctx.lineTo(10, -19); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.beginPath(); ctx.moveTo(10, -26); ctx.lineTo(4, -28); ctx.lineTo(0, -22); ctx.lineTo(6, -21); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#1a1a1a'; ctx.fillRect(-64, -52, 6, 30); ctx.fillRect(-32, -52, 6, 30);
  ctx.fillStyle = '#333';
  ctx.beginPath(); ctx.moveTo(-72, -54); ctx.lineTo(-26, -54); ctx.lineTo(-26, -46); ctx.lineTo(-72, -46); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 3; ctx.stroke();
  const flameLen = 30 + Math.sin(t * 20) * 10;

let heroAnimId = null;

  stopHeroAnim();

function stopHeroAnim(){ if(heroAnimId) cancelAnimationFrame(heroAnimId); heroAnimId = null; }
function drawHeroBanner(cv, tSec){
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#1a0530'); sky.addColorStop(0.5, '#c93a35'); sky.addColorStop(1, '#ff8a30');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  const sunX = W * 0.65, sunY = H * 0.5, sunR = H * 0.35;
  ctx.fillStyle = '#ffd60a'; ctx.beginPath(); ctx.arc(sunX, sunY, sunR, 0, 7); ctx.fill();
  ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 3; ctx.stroke();
  for(let i = 0; i < 12; i++){
    const a = (i / 12) * Math.PI * 2 + tSec * 0.4;
    const r1 = sunR + 4, r2 = sunR + 20 + Math.sin(tSec * 3 + i) * 6;
    ctx.strokeStyle = '#ffd60a'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(sunX + Math.cos(a) * r1, sunY + Math.sin(a) * r1);
    ctx.lineTo(sunX + Math.cos(a) * r2, sunY + Math.sin(a) * r2);
    ctx.stroke();
  }
  const trackTop = H * 0.75;
  const buildings = getHeroBuildings(W, H);
  const now = Date.now();
  buildings.forEach((b, i) => {
    ctx.fillStyle = '#2a0a3a';
    ctx.fillRect(b.x, trackTop - b.h, b.w, b.h);
    ctx.strokeStyle = '#1a0520'; ctx.lineWidth = 1.5;
    ctx.strokeRect(b.x, trackTop - b.h, b.w, b.h);
    b.windows.forEach(w => {
      const twinkle = 0.55 + 0.45 * Math.abs(Math.sin(now * 0.0015 + w.seed * 0.1));
      ctx.fillStyle = `rgba(255, 220, 100, ${twinkle})`;
      ctx.fillRect(w.x, w.y, 3, 4);
    });
    if(b.antennaType === 1){
      ctx.strokeStyle = '#1a0520'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(b.x + b.w/2, trackTop - b.h); ctx.lineTo(b.x + b.w/2, trackTop - b.h - 10); ctx.stroke();
      const blink = Math.sin(now * 0.004 + i) > 0 ? 1 : 0.2;
      ctx.fillStyle = `rgba(255, 50, 50, ${blink})`;
      ctx.beginPath(); ctx.arc(b.x + b.w/2, trackTop - b.h - 12, 2, 0, 7); ctx.fill();
    } else if(b.antennaType === 2){
      ctx.fillStyle = '#3a1a4a'; ctx.fillRect(b.x + b.w/2 - 4, trackTop - b.h - 8, 8, 8);
      ctx.strokeStyle = '#1a0520'; ctx.lineWidth = 1; ctx.strokeRect(b.x + b.w/2 - 4, trackTop - b.h - 8, 8, 8);
    }
  });
  drawHalftone(ctx, 0, 0, W, H, 8, 'rgba(0,0,0,0.08)');
  ctx.fillStyle = '#2a2835'; ctx.fillRect(0, trackTop, W, H - trackTop);
  ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, trackTop); ctx.lineTo(W, trackTop); ctx.stroke();
  ctx.strokeStyle = '#ffd60a'; ctx.lineWidth = 4; ctx.setLineDash([30, 20]);
  ctx.beginPath(); ctx.moveTo(0, trackTop + (H - trackTop) / 2); ctx.lineTo(W, trackTop + (H - trackTop) / 2); ctx.stroke();
  ctx.setLineDash([]);
  const cycle = (tSec * 0.5) % 3, p = cycle / 3;
  const carX = -100 + (W + 200) * p;
  const carY = trackTop + (H - trackTop) * 0.4;
  drawHeroCar(ctx, carX, carY, H / 200, '#ff2d55', '#ffd60a', tSec);
  const vig = ctx.createRadialGradient(W/2, H/2, H*0.2, W/2, H/2, W*0.8);
  vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);
}
function drawHeroCar(ctx, x, y, scale, color, color2, t){
  ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
  for(let i = 0; i < 5; i++){
    const yOff = -15 + i * 6, len = 30 + seededRand(i+30) * 40;
    ctx.strokeStyle = `rgba(255,255,255,0.6)`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-60, yOff); ctx.lineTo(-60 - len, yOff); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.ellipse(0, 15, 55, 6, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#0a0a0f'; ctx.beginPath(); ctx.arc(-38, 0, 16, 0, 7); ctx.fill();
  ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#0a0a0f'; ctx.beginPath(); ctx.arc(52, 8, 8, 0, 7); ctx.fill();
  ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(65, 4); ctx.lineTo(62, -2);
  ctx.bezierCurveTo(58, -6, 50, -8, 40, -10); ctx.lineTo(20, -11);
  ctx.bezierCurveTo(15, -12, 12, -16, 9, -20);
  ctx.lineTo(2, -23); ctx.lineTo(-8, -21); ctx.lineTo(-20, -19); ctx.lineTo(-38, -17);
  ctx.lineTo(-48, -10); ctx.lineTo(-46, 6); ctx.lineTo(35, 8);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = shade(color, 60);
  ctx.beginPath(); ctx.moveTo(50, -4); ctx.lineTo(15, -16); ctx.lineTo(15, -12); ctx.lineTo(50, 0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = color2; ctx.fillRect(-42, -2, 90, 3);
  ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2; ctx.strokeRect(-42, -2, 90, 3);
  ctx.fillStyle = '#4aa8ff';
  ctx.beginPath(); ctx.moveTo(10, -19); ctx.lineTo(2, -23); ctx.lineTo(-6, -21); ctx.lineTo(8, -14); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#333';
  ctx.beginPath(); ctx.moveTo(-55, -38); ctx.lineTo(-20, -38); ctx.lineTo(-20, -32); ctx.lineTo(-55, -32); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2; ctx.stroke();
  const flameLen = 20 + Math.sin(t * 20) * 8;
  const fg = ctx.createRadialGradient(-48, 2, 0, -48, 2, flameLen);
  fg.addColorStop(0, '#fff'); fg.addColorStop(0.4, '#ffd60a');
  fg.addColorStop(0.8, '#ff6b1a'); fg.addColorStop(1, 'rgba(255,45,85,0)');
  ctx.fillStyle = fg;
  ctx.beginPath(); ctx.moveTo(-45, -3); ctx.lineTo(-45 - flameLen - (seededRand(0)*8), 2); ctx.lineTo(-45, 7); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}

/* ==================================================================
   CALCULATIONS
   ================================================================== */
function estimateMarketingEffect(s){
  const m=s.marketing;
  const w=m.social*1.0+m.flyer*0.7+m.influencer*1.4+m.radio*1.6+m.tv*2.4;
  return 1-Math.exp(-w/50000)*0.9;
}
function estimateAttendance(s){
  if(!s.location) return 0;
  const loc=LOCATIONS.find(l=>l.id===s.location);
  const catAppeal=s.categories.reduce((t,id)=>{ const c=CATEGORIES.find(x=>x.id===id); return t+(c.rep/85)*1.6+0.5; },0);
  const mkt=estimateMarketingEffect(s);
  const repF=1+G.rep/120;
  const priceF=clamp(1.35-s.ticketPrice/45,0.25,1.3);
  const infraP=(s.infra.wc>0?1:0.75)*(s.infra.parking>0?1:0.85)*(s.infra.sound>0?1:0.95);
  let base=loc.cap*0.28*loc.q;
  let att=base*(0.5+catAppeal*0.55)*(0.45+mkt*1.4)*repF*priceF*infraP;
  if(s.week%4===0) att*=1.15;
  return clamp(Math.round(att),0,loc.cap);
}
function estimateEntrants(s){
  return s.categories.map(id=>{
    const cat=CATEGORIES.find(c=>c.id===id);
    const mkt=estimateMarketingEffect(s);
    const repF=1+G.rep/100;
    const prizeF=1+cat.purse/20000;
    let n=cat.base*(0.5+mkt*1.1)*repF*prizeF*rnd(0.75,1.15);
    n=clamp(Math.round(n),4,cat.base*2);
    return {cat,n};
  });
}
function calcInfraTotal(s){
  return s.infra.wc*100 + s.infra.buffet*500 + s.infra.tent*350
       + s.infra.parking*200 + s.infra.medical*1000 + s.infra.security*60 + s.infra.sound*800;
}
function calcMarketingTotal(s){ return Object.values(s.marketing).reduce((a,b)=>a+b,0); }

function drawLocationPreview(cv, loc){
  const ctx=cv.getContext('2d');
  const W=cv.width, H=cv.height;
  const groundY=H*0.68;
  const sky=ctx.createLinearGradient(0,0,0,groundY);
  sky.addColorStop(0,'#1a0530'); sky.addColorStop(0.6,'#c93a35'); sky.addColorStop(1,'#ff8a30');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,groundY);
  ctx.fillStyle='#ffd60a';
  ctx.beginPath(); ctx.arc(W*0.8, H*0.2, 20, 0, 7); ctx.fill();
  ctx.strokeStyle='#0a0a0f'; ctx.lineWidth=3; ctx.stroke();
  drawHalftone(ctx, 0, 0, W, groundY, 5, 'rgba(0,0,0,0.1)');
  if(loc.id==='national' || loc.id==='intl'){
    const buildings = getComicBuildings(W);
    const now = Date.now();
    buildings.forEach((b, i)=>{
      ctx.fillStyle='#2a0a3a'; ctx.fillRect(b.x, groundY - b.h, b.w, b.h);
      ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 3;
      ctx.strokeRect(b.x, groundY - b.h, b.w, b.h);
      for(let wy = groundY - b.h + 6; wy < groundY - 10; wy += 14){
        for(let wx = b.x + 5; wx < b.x + b.w - 8; wx += 12){
          if((i*3 + Math.floor(wy/14) + Math.floor(wx/12)) % 3 === 0){
            const twinkle = 0.55 + 0.45 * Math.abs(Math.sin(now * 0.002 + wx * 0.1 + wy * 0.05));
            ctx.fillStyle = `rgba(255, 214, 10, ${twinkle})`;
            ctx.fillRect(wx, wy, 6, 8);
            ctx.strokeStyle='#0a0a0f'; ctx.lineWidth=1; ctx.strokeRect(wx, wy, 6, 8);
          } else {
            ctx.fillStyle = '#0a0a12'; ctx.fillRect(wx, wy, 6, 8);
            ctx.strokeStyle='#0a0a0f'; ctx.lineWidth=1; ctx.strokeRect(wx, wy, 6, 8);
          }
        }
      }
      if(b.antennaType === 1){
        ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(b.x + b.w/2, groundY - b.h); ctx.lineTo(b.x + b.w/2, groundY - b.h - 12); ctx.stroke();
        const blink = Math.sin(now * 0.004 + i) > 0 ? 1 : 0.2;
        ctx.fillStyle = `rgba(255, 50, 50, ${blink})`;
        ctx.beginPath(); ctx.arc(b.x + b.w/2, groundY - b.h - 14, 3, 0, 7); ctx.fill();
        ctx.strokeStyle = '#0a0a0f'; ctx.lineWidth = 1; ctx.stroke();
      }
    });
  }
  ctx.fillStyle='#2a2835'; ctx.fillRect(0,groundY,W,H-groundY);
  ctx.strokeStyle='#0a0a0f'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(0,groundY); ctx.lineTo(W,groundY); ctx.stroke();
  const trackTop = groundY + 5;
  ctx.fillStyle='#3a3a48'; ctx.fillRect(0, trackTop, W, H-trackTop-5);
  ctx.strokeStyle='#ffd60a'; ctx.lineWidth=3; ctx.setLineDash([20, 15]);
  ctx.beginPath(); ctx.moveTo(0, (trackTop + H) / 2); ctx.lineTo(W, (trackTop + H) / 2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle='#fff'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(30, trackTop); ctx.lineTo(30, H-5); ctx.stroke();
  const cw=14, ch=10;
  for(let y=trackTop;y<H-5;y+=ch){
    for(let x=W-55;x<W-40;x+=cw){
      const i=Math.floor((y-trackTop)/ch)%2;
      ctx.fillStyle=i?'#000':'#fff'; ctx.fillRect(x,y,cw,ch);
    }
  }
  if(loc.id==='airport'){
    ctx.fillStyle='#d8d8e8'; ctx.beginPath(); ctx.ellipse(W*0.6, H*0.25, 30, 5, 0, 0, 7); ctx.fill();
    ctx.strokeStyle='#0a0a0f'; ctx.lineWidth=3; ctx.stroke();
    ctx.fillStyle='#2a2530'; ctx.fillRect(W*0.25, groundY-50, 12, 50);
    ctx.strokeStyle='#0a0a0f'; ctx.lineWidth=3; ctx.strokeRect(W*0.25, groundY-50, 12, 50);
    ctx.fillStyle='#3a3540'; ctx.fillRect(W*0.25-10, groundY-65, 32, 18); ctx.strokeRect(W*0.25-10, groundY-65, 32, 18);
    for(let i=0;i<3;i++){
      ctx.fillStyle='#ffd60a'; ctx.fillRect(W*0.25-4+i*9, groundY-62, 5, 8);
      ctx.strokeStyle='#0a0a0f'; ctx.lineWidth=1; ctx.strokeRect(W*0.25-4+i*9, groundY-62, 5, 8);
    }
  } else if(loc.id==='county'){
    for(let i=0;i<8;i++){
      const tx=40+i*55;
      ctx.fillStyle='#0a5a20';
      ctx.beginPath(); ctx.moveTo(tx,groundY-50); ctx.lineTo(tx-15,groundY-10); ctx.lineTo(tx+15,groundY-10); ctx.closePath(); ctx.fill();
      ctx.strokeStyle='#0a0a0f'; ctx.lineWidth=3; ctx.stroke();
    }
    ctx.fillStyle='#8a5a20'; ctx.fillRect(W*0.05, groundY-55, 160, 55);
    ctx.strokeStyle='#0a0a0f'; ctx.lineWidth=3; ctx.strokeRect(W*0.05, groundY-55, 160, 55);
    for(let r=0;r<4;r++){
      ctx.fillStyle='#a06028'; ctx.fillRect(W*0.05, groundY-55+r*13, 160, 11); ctx.strokeRect(W*0.05, groundY-55+r*13, 160, 11);
    }
    for(let i=0;i<40;i++){
      const nx = W*0.05 + 5 + (i%18) * 8.5;
      const ny = groundY-52 + Math.floor(i/18)*13 + 3;
      ctx.fillStyle = ['#ff2d55','#00b4ff','#ffd60a','#fff'][i%4];
      ctx.beginPath(); ctx.arc(nx, ny, 3, 0, 7); ctx.fill();
      ctx.strokeStyle='#0a0a0f'; ctx.lineWidth=1; ctx.stroke();
    }
  } else if(loc.id==='intl'){
    ctx.fillStyle='#0a0a0f'; ctx.fillRect(W*0.38, groundY-95, 130, 55);
    ctx.strokeStyle='#ffd60a'; ctx.lineWidth=3; ctx.strokeRect(W*0.38, groundY-95, 130, 55);
    ctx.fillStyle='#ff2d55'; ctx.font='bold 20px Impact, sans-serif'; ctx.fillText('DRAG', W*0.38+15, groundY-68);
    ctx.fillStyle='#00b4ff'; ctx.fillText('LIVE', W*0.38+75, groundY-68);
    for(let i=0;i<4;i++){
      const x=W*0.15+i*W*0.22;
      ctx.fillStyle='#333'; ctx.fillRect(x-3, groundY-140, 6, 140);
      ctx.strokeStyle='#0a0a0f'; ctx.lineWidth=3; ctx.strokeRect(x-3, groundY-140, 6, 140);
      ctx.fillStyle='#222'; ctx.fillRect(x-25, groundY-145, 50, 8); ctx.strokeRect(x-25, groundY-145, 50, 8);
      ctx.fillStyle='#ffd60a'; ctx.beginPath(); ctx.arc(x, groundY-148, 5, 0, 7); ctx.fill();
      ctx.strokeStyle='#0a0a0f'; ctx.lineWidth=2; ctx.stroke();
    }
  }
}

function launchEvent(){
  const s=G.setup;
  const loc=LOCATIONS.find(l=>l.id===s.location);
  const totalCost=loc.cost+
    s.categories.reduce((t,id)=>t+CATEGORIES.find(c=>c.id===id).purse,0)+
    calcMarketingTotal(s)+calcInfraTotal(s);
  if(G.money<totalCost){ alert('Nincs elég tőkéd!'); return; }
  G.money-=totalCost;
  const entrants={};
  estimateEntrants(s).forEach(e=>{ entrants[e.cat.id]=genDrivers(e.cat,e.n); });
  const spectators=estimateAttendance(s);
  const ev={setup:JSON.parse(JSON.stringify(s)),loc,spectators,entrants,
    qualifying:{},brackets:{},results:{},
    revenue:{entry:0,ticket:0,buffet:0,tent:0},cost:totalCost};
  ev.timeOfDay = (ev.setup.week % 2 === 0) ? 'day' : 'night';
  Object.entries(entrants).forEach(([cid,ds])=>{
    const cat=CATEGORIES.find(c=>c.id===cid);
    ev.revenue.entry+=ds.length*cat.entry;
  });
  ev.revenue.ticket=spectators*s.ticketPrice;
  ev.revenue.buffet=Math.round(spectators*5*(s.infra.buffet>0?1:0.35));
  ev.revenue.tent=s.infra.tent*300;
  G.event=ev; G.view='race';
  buildQualifying(ev); buildBrackets(ev);
  Commentator.clear();
  render();
  setTimeout(()=>Commentator.say('intro'),400);
}
function genDrivers(cat, n){
  const used=new Set(); const arr=[];
  for(let i=0;i<n;i++){
    let name; let tries=0;
    do{ name=pick(FIRST_NAMES)+' '+pick(LAST_NAMES); tries++; }
    while(used.has(name)&&tries<20);
    used.add(name);
    const skill=Math.random();
    const etBase=cat.et[0]+(cat.et[1]-cat.et[0])*(0.15+skill*0.85);
    const spBase=cat.sp[0]+(cat.sp[1]-cat.sp[0])*(0.15+skill*0.85);
    let drivetrain;
    if(['funnycar','topfuel','promod','prostock','supercomp'].includes(cat.id)) drivetrain='RWD';
    else if(cat.id==='prostreet') drivetrain = Math.random()<0.7 ? 'RWD' : 'AWD';
    else { const r=Math.random(); drivetrain = r<0.55 ? 'FWD' : r<0.85 ? 'RWD' : 'AWD'; }
    let fuel='petrol';
    if((cat.id==='street' || cat.id==='prostreet') && Math.random()<0.22) fuel='diesel';
    let hasChute=false;
    if(['promod','prostock','funnycar','topfuel'].includes(cat.id)) hasChute=true;
    else if(cat.id==='supercomp') hasChute = Math.random()<0.5;
    else if(cat.id==='prostreet') hasChute = Math.random()<0.25;
    const liv = pick((drivetrain==='FWD' || Math.random()<0.5) ? LIVERY_A : LIVERY_B);
    const livery = {color:liv.color,color2:liv.color2,pattern:liv.pattern,
      hasFlames:liv.pattern==='flames',hasStripes:liv.pattern==='stripe',hasTwoTone:liv.pattern==='twotone'};
    arr.push({name, team:pick(TEAM_NAMES), etBase, spBase, skill,
      rtBase: 0.06+(1-skill)*0.14, car:ri(1,999),
      drivetrain, fuel, hasChute, catRef: cat, livery});
  }
  return arr;
}
function runOnce(d){
  let rt=d.rtBase+(Math.random()-0.5)*0.06;
  let red=false, stuck=false, slideOff=false;
  if(Math.random()<0.04*(1-d.skill)){ rt=-rnd(0.005,0.08); red=true; }
  else if(rt<0.001) rt=rnd(0.001,0.02);

  // Beragadás a startnál: kicsi esély, alacsony skill → nagyobb
  if(!red && Math.random()<0.008*(1-d.skill+0.3)){
    stuck = true;
  }

  let et=d.etBase+(Math.random()-0.5)*0.14;
  let dnf=false;
  if(Math.random()<0.015*(1-d.skill)){ et+=rnd(0.5,2.5); dnf=true; }

  // Kicsúszás: közepes futam közben, kicsi esély
  if(!stuck && Math.random()<0.014*(1-d.skill+0.2)){
    slideOff = true;
    et += rnd(0.25, 1.2);
  }

  if(stuck) et = 99.99; // ne mozduljon el

  const speed=d.spBase*(1+(Math.random()-0.5)*0.015)-(dnf?rnd(5,25):0);
  return {rt,et,speed:Math.max(speed,100),red,dnf,stuck,slideOff};
}
function buildQualifying(ev){
  Object.entries(ev.entrants).forEach(([cid,drivers])=>{
    const runs=drivers.map(d=>{
      const r1=runOnce(d), r2=runOnce(d);
      const valid=[r1,r2].filter(r=>!r.red&&!r.dnf&&!r.stuck);
      const best=valid.length?valid.reduce((a,b)=>a.et<b.et?a:b):r1;
      return {driver:d,best,ok:valid.length>0,runs:[r1,r2]};
    });
    runs.sort((a,b)=>{ if(a.ok!==b.ok) return a.ok?-1:1;
      if(!a.ok && !b.ok) return 0; return a.best.et-b.best.et; });
    ev.qualifying[cid]=runs;
  });
}
function buildBrackets(ev){
  Object.entries(ev.qualifying).forEach(([cid,q])=>{
    const valid=q.filter(x=>x.ok);
    const size=valid.length>=16?16:valid.length>=8?8:valid.length>=4?4:valid.length>=2?2:0;
    if(!size){ ev.brackets[cid]=null; return; }
    const field=valid.slice(0,size).map(x=>({d:x.driver,q:x.best}));
    const round0=[];
    for(let i=0;i<size/2;i++) round0.push({a:field[i],b:field[size-1-i],winner:null});
    const rounds=[round0];
    let cur=size/2;
    while(cur>1){ const next=[]; for(let i=0;i<cur/2;i++) next.push({a:null,b:null,winner:null}); rounds.push(next); cur/=2; }
    ev.brackets[cid]={rounds,size};
  });
}

function renderRace(){

function afterRaceRender(){ nextRaceMatch(); }
let raceState=null;
function nextRaceMatch(){
  if(!G.animating) SFX.forceStopEngine();
  const ev=G.event; if(!ev) return;
  const cids=Object.keys(ev.brackets).filter(c=>ev.brackets[c]);
  let found=null;
  for(const cid of cids){
    const b=ev.brackets[cid];
    for(let ri=0;ri<b.rounds.length && !found;ri++){
      for(let mi=0;mi<b.rounds[ri].length;mi++){
        const m=b.rounds[ri][mi];
        if(m.winner) continue;
        if(!m.a || !m.b){
          if(ri===0) continue;
          const prev=b.rounds[ri-1];
          if(!m.a && prev[mi*2]?.winner) m.a=prev[mi*2].winner;
          if(!m.b && prev[mi*2+1]?.winner) m.b=prev[mi*2+1].winner;
          if(!m.a || !m.b) continue;
        }
        found={cid,ri,mi,m,b}; break;
      }
    }
    if(found) break;
  }
  if(!found){ finishEvent(); return; }
  raceState=found;
  renderRaceStage(found);
}

  const badges=[];

  else badges.push('🡐RWD');
  if(d.fuel==='diesel') badges.push('⛽ D');
  if(d.hasChute) badges.push('🪂');
  return badges.join(' ');
}
