function skipAll(){
  SFX.forceStopEngine();
  const ev=G.event; if(!ev) return;
  const cids=Object.keys(ev.brackets).filter(c=>ev.brackets[c]);
  cids.forEach(cid=>{
    const b=ev.brackets[cid];
    for(let ri=0;ri<b.rounds.length;ri++){
      for(let mi=0;mi<b.rounds[ri].length;mi++){
        const m=b.rounds[ri][mi];
        if(m.winner) continue;
        if(!m.a||!m.b){
          if(ri===0) continue;
          const prev=b.rounds[ri-1];
          if(!m.a && prev[mi*2]?.winner) m.a=prev[mi*2].winner;
          if(!m.b && prev[mi*2+1]?.winner) m.b=prev[mi*2+1].winner;
          if(!m.a||!m.b) continue;
        }
        const ra=runOnce(m.a.d), rb=runOnce(m.b.d);
        m.a.run=ra; m.b.run=rb; m.aTime=ra.rt+ra.et; m.bTime=rb.rt+rb.et;
        let w;
        if(ra.stuck && !rb.stuck) w='b';
        else if(rb.stuck && !ra.stuck) w='a';
        else if(ra.red&&!rb.red) w='b';
        else if(rb.red&&!ra.red) w='a';
        else w=(ra.rt+ra.et)<(rb.rt+rb.et)?'a':'b';
        m.winnerSide=w; m.winner=w==='a'?m.a:m.b;
        propagateWinner(b,ri,mi,m.winner);
      }
    }
  });
  finishEvent();
}
function finishEvent(){
  SFX.forceStopEngine();
  const ev=G.event;
  Object.entries(ev.brackets).forEach(([cid,b])=>{
    if(!b){ ev.results[cid]=null; return; }
    const finalRound=b.rounds[b.rounds.length-1];
    const fm=finalRound[0];
    const winner=fm.winner;
    const runnerUp=fm.winnerSide==='a'?fm.b:fm.a;
    let semis=[];
    if(b.rounds.length>=2){
      const sr=b.rounds[b.rounds.length-2];
      sr.forEach(m=>{ if(m.winner&&m.winner!==winner) semis.push(m.winner); });
    }
    ev.results[cid]={winner,runnerUp,semis};
  });
  let pursePaid=0;
  Object.entries(ev.results).forEach(([cid,r])=>{
    if(!r) return;
    const cat=CATEGORIES.find(c=>c.id===cid);
    pursePaid+=cat.purse*0.60;
    pursePaid+=cat.purse*0.25;
    r.semis.forEach(()=> pursePaid+=cat.purse*0.075);
  });
  ev.pursePaid=pursePaid;
  const totalRev=ev.revenue.entry+ev.revenue.ticket+ev.revenue.buffet+ev.revenue.tent;
  const profit=totalRev-ev.cost-pursePaid;
  G.money+=totalRev-pursePaid;
  const repGain=Math.max(1,Math.round(
    (ev.spectators/2500)+(Object.values(ev.entrants).reduce((t,a)=>t+a.length,0)/60)
  ));
  G.rep+=repGain;
  G.week=ev.setup.week+1;
  ev.profit=profit; ev.repGain=repGain; ev.totalRev=totalRev;
  G.history.push({week:ev.setup.week,locName:ev.loc.name,
    cats:Object.keys(ev.entrants),spectators:ev.spectators,profit});
  SFX.stopEngine();
  G.view='results';
  render();
}

/* ==================================================================
   RESULTS
   ================================================================== */
function renderResults(){
  const ev=G.event;
  if(!ev){ G.view='hub'; return renderHub(); }
  const pursePaid=ev.pursePaid||0;
  const profit=ev.profit;
  let catsHtml='';
  Object.entries(ev.results).forEach(([cid,r])=>{
    const cat=CATEGORIES.find(c=>c.id===cid);
    if(!r){ catsHtml+=`<div class="card"><h2>${cat.icon} ${esc(cat.name)}</h2>
      <p class="sub">Nem indult elég autó.</p></div>`; return; }
    const q=ev.qualifying[cid];
    catsHtml+=`<div class="card">
      <h2>${cat.icon} ${esc(cat.name)}</h2>
      <table>
        <tr><th>#</th><th>Versenyző</th><th>Csapat</th><th>ET</th><th>Díj</th></tr>
        <tr><td class="pos1">🥇</td><td>${esc(r.winner.d.name)}</td><td>${esc(r.winner.d.team)}</td>
          <td>${q.find(x=>x.driver===r.winner.d).best.et.toFixed(3)}s</td>
          <td class="pos">${money(cat.purse*0.60)}</td></tr>
        <tr><td class="pos2">🥈</td><td>${esc(r.runnerUp.d.name)}</td><td>${esc(r.runnerUp.d.team)}</td>
          <td>${q.find(x=>x.driver===r.runnerUp.d).best.et.toFixed(3)}s</td>
          <td class="pos">${money(cat.purse*0.25)}</td></tr>
        ${r.semis.map(s=>`<tr><td class="pos3">🥉</td><td>${esc(s.d.name)}</td><td>${esc(s.d.team)}</td>
          <td>${q.find(x=>x.driver===s.d).best.et.toFixed(3)}s</td>
          <td class="pos">${money(cat.purse*0.075)}</td></tr>`).join('')}
      </table>
    </div>`;
  });
  return `<div class="scroll-content">
    <div class="card fade">
      <h2>🎉 VERSENY VÉGET ÉRT!</h2>
      <p class="sub">${esc(ev.loc.name)} · ${ev.setup.week}. hét · ${fmt(ev.spectators)} néző · ${ev.timeOfDay==='day'?'☀️':'🌙'}</p>
      <div class="grid g2">
        <div>
          <div class="summary-row"><span><span class="icon">🚗</span> Nevezők</span><span>${Object.values(ev.entrants).reduce((t,a)=>t+a.length,0)} autó</span></div>
          <div class="summary-row"><span><span class="icon">👥</span> Nézők</span><span>${fmt(ev.spectators)} fő</span></div>
          <div class="summary-row"><span><span class="icon">🏁</span> Kategóriák</span><span>${Object.keys(ev.entrants).length} db</span></div>
        </div>
        <div>
          <div class="summary-row"><span>Jegybevétel</span><span class="pos">${money(ev.revenue.ticket)}</span></div>
          <div class="summary-row"><span>Nevezési díjak</span><span class="pos">${money(ev.revenue.entry)}</span></div>
          <div class="summary-row"><span>Büfé</span><span class="pos">${money(ev.revenue.buffet)}</span></div>
          <div class="summary-row"><span>Sátor</span><span class="pos">${money(ev.revenue.tent)}</span></div>
          <div class="summary-row"><span>Költségek</span><span class="neg">-${money(ev.cost)}</span></div>
          <div class="summary-row"><span>Díjak</span><span class="neg">-${money(pursePaid)}</span></div>
        </div>
      </div>
      <div class="hr"></div>
      <div class="summary-row" style="font-size:22px;background:#ffeb99;padding:12px;border-radius:8px;border:3px solid #0a0a0f">
        <span><b>PROFIT</b></span>
        <span class="${profit>=0?'pos':'neg'}"><b>${money(profit)}</b></span></div>
      <div class="summary-row" style="margin-top:8px"><span>⭐ Hírnév növekedés</span><span class="pos">+${ev.repGain}</span></div>
      <div class="btnrow" style="margin-top:12px">
        <button class="primary" data-action="backHub" style="font-size:15px;padding:12px 24px">🏠 FŐMENÜ</button>
      </div>
    </div>
    ${catsHtml}
  </div>`;
}

/* ==================================================================
   EVENTS
   ================================================================== */
document.addEventListener('click', e=>{
  const camBtn=e.target.closest('[data-cam]');
  if(camBtn){
    G.camMode=camBtn.dataset.cam;
    document.querySelectorAll('.cam-controls button').forEach(b=>{
      b.classList.toggle('active', b.dataset.cam===camBtn.dataset.cam);
    });
    if(raceState && !G.animating){ drawSceneStatic(raceState.m); }
    return;
  }
  const el=e.target.closest('[data-action]');
  if(!el) return;
  const a=el.dataset.action;
  const s=G.setup;
  switch(a){
    case 'newEvent': newSetup(); break;
    case 'cancelSetup': SFX.forceStopEngine(); G.setup=null; G.view='hub'; render(); break;
    case 'setLocation': {
      const loc=LOCATIONS.find(l=>l.id===el.dataset.id);
      if(G.money<loc.cost) return;
      if(loc.prestige>3 && G.rep<40) return;
      s.location=loc.id; render(); break;
    }
    case 'setWeek': s.week=+el.dataset.w; render(); break;
    case 'toggleCat': {
      const id=el.dataset.id;
      const cat=CATEGORIES.find(c=>c.id===id);
      if(G.rep<cat.rep) return;
      const i=s.categories.indexOf(id);
      if(i>=0) s.categories.splice(i,1); else s.categories.push(id);
      render(); break;
    }
    case 'nextStep': if(validateStep(s)){ s.step=Math.min(6,s.step+1); render(); } break;
    case 'prevStep': s.step=Math.max(0,s.step-1); render(); break;
    case 'launchEvent': launchEvent(); break;
    case 'runMatch': runMatch(); break;
    case 'skipAll': skipAll(); break;
    case 'showBracket': showBracket(); break;
    case 'backHub': SFX.forceStopEngine(); G.event=null; G.setup=null; G.view='hub'; render(); break;
  }
});
document.addEventListener('input', e=>{
  const input=e.target.closest('[data-slider]');
  if(!input) return;
  const path=input.dataset.slider;
  const val=+input.value;
  const s=G.setup; if(!s) return;
  if(path==='ticketPrice'){ s.ticketPrice=val; }
  else { const [group,key]=path.split('.'); if(s[group]) s[group][key]=val; }
  updateAllLiveValues();
});
window.addEventListener('resize', ()=>{
  if(G.view==='race' && raceState && !G.animating){ drawSceneStatic(raceState.m); }
  if(G.view==='hub'){
    const cv = document.getElementById('heroCanvas');
    if(cv){ cv.width = cv.clientWidth; cv.height = cv.clientHeight; }
  }
});
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    this.beginPath();
    this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);
    this.arcTo(x,y,x+w,y,r);
    this.closePath();
    return this;
  };
}

$('#splashStart').addEventListener('click', ()=>{
  $('#splash').classList.add('hidden');
  stopSplashAnimation();
  Music.init();
  G.view='hub';
  render();
  setTimeout(()=>{
    Music.play('rock');
    const sel=$('#musicSelect');
    if(sel) sel.value='rock';
    const bar=$('#musicBar');
    if(bar) bar.classList.add('playing');
  },100);
  setTimeout(()=>{ const s=$('#splash'); if(s) s.style.display='none'; },800);
});
startSplashAnimation();
</script>
